<script type="module">
// Registrazione PWA Service Worker
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js')
      .then(reg => console.log('PWA ServiceWorker registrato con successo:', reg.scope))
      .catch(err => console.warn('Registrazione PWA fallita:', err));
  });
}

// GESTIONE ISTANTANEA SCREENLOCK & RILEVAMENTO OS / VERSIONI
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  renderScreenLockUI();
});

function detectOSAndVersion() {
  const ua = navigator.userAgent || navigator.vendor || window.opera;
  let os = "Desktop";
  let version = "";

  if (/android/i.test(ua)) {
    os = "Android";
    const match = ua.match(/Android\s([0-9\.]+)/);
    if (match) version = match[1];
  } else if (/iPad|iPhone|iPod/.test(ua) && !window.MSStream) {
    os = "iOS";
    const match = ua.match(/OS\s([\d_]+)/);
    if (match) version = match[1].replace(/_/g, '.');
  } else if (/Macintosh|MacIntel|MacPPC|Mac68K/.test(ua)) {
    os = "macOS";
    const match = ua.match(/Mac OS X\s([\d_]+)/);
    if (match) version = match[1].replace(/_/g, '.');
  } else if (/Win/.test(ua)) {
    os = "Windows";
  }
  return { os, version };
}

function renderScreenLockUI() {
  const container = document.getElementById("pwa-action-container");
  if(!container) return;

  const { os, version } = detectOSAndVersion();
  let majorVer = parseInt(version, 10) || 0;

  if (window._isPWAInstalled) {
    document.getElementById("pwa-screenlock").style.display = "none";
    return;
  }

  let htmlContent = "";

  if (os === "Android") {
    htmlContent = `
      <div class="p-4 rounded-2xl bg-sky-950/40 border border-sky-500/30 text-xs text-slate-200 space-y-2">
        <span class="text-sky-300 font-bold block">Dispositivo Android Rilevato</span>
        <p>Installa l'applicazione con un solo click per sbloccare l'interfaccia a schermo intero.</p>
      </div>
      <button id="pwa-install-btn" class="btn w-full py-3.5 text-sm font-bold shadow-lg shadow-sky-900/50">
        📥 Installa l'app
      </button>
    `;
  } else if (os === "Windows") {
    htmlContent = `
      <div class="p-4 rounded-2xl bg-sky-950/40 border border-sky-500/30 text-xs text-slate-200 space-y-2">
        <span class="text-sky-300 font-bold block">PC Desktop Windows Rilevato</span>
        <p>Aggiungi l'app al desktop per un'esperienza nativa e fluida.</p>
      </div>
      <button id="pwa-install-btn" class="btn w-full py-3.5 text-sm font-bold shadow-lg shadow-sky-900/50">
        📥 Installa su Windows
      </button>
    `;
  } else if (os === "iOS") {
    let safariGuide = "";
    if (majorVer >= 17) {
      safariGuide = `Tocca l'icona di <b>Condivisione (quadradino con freccia in sù ⎋)</b> nella barra in basso di Safari, quindi scorri e seleziona <b>"Aggiungi alla schermata Home" (+)</b>.`;
    } else if (majorVer >= 15 && majorVer < 17) {
      safariGuide = `Tocca il tasto <b>Condivisione ⎋</b> in basso al centro su Safari, poi scorri l'elenco e tocca <b>"Aggiungi alla schermata Home"</b>.`;
    } else {
      safariGuide = `Tocca il tasto centrale <b>Condivisione ⎋</b> nel browser Safari e seleziona l'icona <b>"+" Aggiungi a Home</b>.`;
    }

    htmlContent = `
      <div class="p-4 rounded-2xl bg-blue-950/60 border border-sky-500/40 text-xs text-sky-100 space-y-3 text-left">
        <div class="flex items-center gap-2 font-bold text-white">
          <span class="w-2 h-2 rounded-full bg-amber-400"></span> Dispositivo Apple iOS (v${version || 'Recente'})
        </div>
        <p class="leading-relaxed">
          ${safariGuide}
        </p>
        <div class="text-[10px] text-sky-300 bg-black/40 p-2.5 rounded-xl border border-sky-500/20">
          ⚠️ <b>Nota:</b> Apri questa pagina obbligatoriamente dal browser <b>Safari</b> (non funzionante se aperto da app terze come Instagram o WhatsApp).
        </div>
      </div>
      <button type="button" class="btn-ghost w-full text-xs" onClick="window.location.reload()">
        🔄 Ho installato l'App, aggiorna interfaccia
      </button>
    `;
  } else if (os === "macOS") {
    htmlContent = `
      <div class="p-4 rounded-2xl bg-blue-950/60 border border-sky-500/40 text-xs text-sky-100 space-y-3 text-left">
        <div class="font-bold text-white">Computer Apple macOS Rilevato</div>
        <p>
          Apri il sito su browser <b>Safari</b>, vai nel menu in alto <b>File -> "Aggiungi al Dock"</b> oppure usa <b>Condivisione -> Aggiungi alla schermata Home</b>.
        </p>
      </div>
      <button type="button" class="btn-ghost w-full text-xs" onClick="window.location.reload()">
        🔄 Aggiorna Stato App
      </button>
    `;
  } else {
    htmlContent = `
      <div class="p-4 rounded-2xl bg-slate-900 border border-sky-500/30 text-xs text-slate-300">
        <p>Installa l'app dal menu del tuo browser (icona Installazione o "Aggiungi a schermata Home") per sbloccare l'applicazione.</p>
      </div>
      <button id="pwa-install-btn" class="btn w-full py-3.5 text-sm font-bold">
        📥 Installa app
      </button>
    `;
  }

  container.innerHTML = htmlContent;

  const installBtn = document.getElementById("pwa-install-btn");
  if (installBtn) {
    installBtn.addEventListener("click", async () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        if (outcome === 'accepted') {
          window._isPWAInstalled = true;
          document.getElementById("pwa-screenlock").style.display = "none";
        }
        deferredPrompt = null;
      } else {
        alert("Per installare l'App, utilizza il menu del browser (es. 'Installa app' o 'Aggiungi a schermata Home').");
      }
    });
  }
}

// Esecuzione immediata all'avvio
document.addEventListener("DOMContentLoaded", () => {
  if (window._isPWAInstalled) {
    document.getElementById("pwa-screenlock").style.display = "none";
  } else {
    renderScreenLockUI();
  }
});
</script>

async function groq({messages, json, maxTokens=3000, temperature=.6}){
  const body = {model: CFG.TEXT, messages, temperature, max_tokens: maxTokens};
  if(json) body.response_format = {type: "json_object"};
  const r = await fetch("https://api.groq.com/openai/v1/chat/completions", {
    method: "POST",
    headers: {"Authorization": "Bearer "+CFG.GROQ_KEY, "Content-Type": "application/json"},
    body: JSON.stringify(body)
  });
  if(!r.ok) throw Error("Errore chiamata Groq AI");
  const j = await r.json();
  return (j.choices[0].message.content||"").trim();
}

async function uploadToCloudinary(file) {
  try {
    const fd = new FormData();
    fd.append("file", file);
    fd.append("upload_preset", CFG.CLOUD_PRESET);
    const r = await fetch(`https://api.cloudinary.com/v1_1/${CFG.CLOUD_NAME}/image/upload`, { method: "POST", body: fd });
    if(r.ok) {
      const data = await r.json();
      return data.secure_url;
    }
  } catch(e) { console.warn("Cloudinary upload fallback:", e); }
  return new Promise((resolve) => {
    const reader = new FileReader();
    reader.onloadend = () => resolve(reader.result);
    reader.readAsDataURL(file);
  });
}

  const send = async (e) => {
    e.preventDefault();

    const userMsg = input.trim();
    setInput("");
    const newMsgs = [...messages, { role: "user", content: userMsg }];

    } catch(err) {
      setMessages([...newMsgs, { role: "assistant", content: "Spiacente, si è verificato un errore durante l'elaborazione del messaggio Orion AI." }]);

        <input class="field" type="password" required minlength="6" placeholder="Password" value=${pass} onInput=${e=>setPass(e.target.value)}/>
        
        ${isReg && html`
          <label class="flex items-start gap-2 cursor-pointer text-xs text-slate-300 pt-2 border-t border-sky-500/20">
            <input type="checkbox" required checked=${acceptGdpr} onChange=${e=>setAcceptGdpr(e.target.checked)} class="mt-0.5 accent-sky-500"/>
            <span>Accetto il trattamento dati GDPR Horizon Datacenter.</span>
          </label>
        `}

        ${err && html`<p class="text-xs text-red-400 text-center">${err}</p>`}
        <button type="submit" class="btn w-full" disabled=${busy}>${isReg?"Registrati":"Accedi"}</button>
        <button type="button" class="w-full text-xs text-sky-400 bg-transparent border-0 cursor-pointer text-center" onClick=${()=>setIsReg(!isReg)}>
          ${isReg?"Hai già un account? Accedi":"Non hai un account? Registrati"}
        </button>
      </form>
    </div>
  `;
}

// FORM PROFILAZIONE ARMOCROMATICA COMPLETO A SCORRIMENTO WIZARD LATERALE
function IntakeSurvey({onDone}){
  const {user} = useApp();
  const [step, setStep] = useState(1);
  const totalSteps = 6;

  const [f, setF] = useState({
    // Step 1: Base & Localizzazione
    gender: "Donna",
    city: "Milano",
    // Step 2: Incarnato & Sottotono
    skinTone: "Chiara / Porcellana",
    sunReaction: "Mi scotto facilmente, bronzo lento",
    veinsColor: "Blu / VIola (Cool)",
    redness: "Frequenti (Pelle sensibile o rosacea)",
    // Step 3: Occhi & Iride
    eyeColor: "Marrone Scuro / Nero",
    eyeFlecks: "Nessuna sfumatura, iride omogenea",
    eyeContrast: "Alto contrasto (Bianco sclera brillante)",
    // Step 4: Capelli & Riflessi
    hairNatural: "Castano Scuro / Bruno",
    hairReflections: "Cenere / Freddi / Nessuno",
    // Step 5: Contrasto & Valore Sovrano
    overallContrast: "Alto (Contrasto forte pelle/occhi/capelli)",
    overallValue: "Scuro / Intenso (Deep)",
    // Step 6: Risposta ai Colori & Metalli
    metalPreference: "Argento / Platino (Freddo)",
    colorReaction: "Nero e colori saturi mi illuminano",
    worstColor: "Arancio caldo e senape mi ingrigiscono"
  });

  const [busy, setBusy] = useState(false);

  // Calcolo scientifico preciso della stagione armocromatica in base ai dati inseriti
  const calculateSeason = () => {
    let warmScore = 0;
    let coolScore = 0;
    let deepScore = 0;
    let lightScore = 0;

    // Sottotono
    if(f.veinsColor.includes("Verdi")) warmScore += 2;
    if(f.veinsColor.includes("Blu")) coolScore += 2;
    if(f.sunReaction.includes("Abbronzatura dorata")) warmScore += 1.5;
    if(f.sunReaction.includes("scotto facilmente")) coolScore += 1.5;

    // Capelli & Riflessi
    if(f.hairReflections.includes("Dorati") || f.hairReflections.includes("Rame")) warmScore += 1.5;
    if(f.hairReflections.includes("Cenere")) coolScore += 1.5;

    // Metallo
    if(f.metalPreference.includes("Oro")) warmScore += 2;
    if(f.metalPreference.includes("Argento")) coolScore += 2;

    // Valore / Contrasto
    if(f.overallValue.includes("Scuro") || f.hairNatural.includes("Scuro") || f.eyeColor.includes("Scuro")) deepScore += 2;
    if(f.overallValue.includes("Chiaro") || f.hairNatural.includes("Biondo")) lightScore += 2;

    const isWarm = warmScore > coolScore;
    const isDeep = deepScore >= lightScore;

    if(isWarm) {
      return isDeep ? "autunno" : "primavera";
    } else {
      return isDeep ? "inverno" : "estate";
    }
  };

  const submit = async (e) => {
    if (e) e.preventDefault();
    setBusy(true);
    const assignedSeason = calculateSeason();

    const payload = {
      gender: f.gender,
      city: f.city,
      intake: f,
      season: assignedSeason,
      tier: "free",
      onboarded: true,
      profile: {
        season: assignedSeason,
        gender: f.gender,
        city: f.city,
        notes: `Diagnosi Completa: Sottotono ${assignedSeason.toUpperCase()} calcolato su parametri avanzati.`
      }
    };

    if(rtdb) await update(ref(rtdb, "users/"+user.uid), payload);
    setBusy(false);
    onDone();
  };

  const nextStep = () => {
    if(step < totalSteps) setStep(step + 1);
    else submit();
  };

  const prevStep = () => {
    if(step > 1) setStep(step - 1);
  };

  return html`

function isUnlockedTier(userTier, videoTier) {
  if(videoTier === "free" || !videoTier) return true;
  if(userTier === "plus") return true;
  if(userTier === "pro" && (videoTier === "pro" || videoTier === "free")) return true;
  return false;
}

function SocialPageModule(){

function WardrobeModule(){
  const {canAccess, user, wardrobeItems, profileData, userGender} = useApp();
  const [step, setStep] = useState(1);
  const [qType, setQType] = useState("Giacca/Cappotto");
  const [qOccasion, setQOccasion] = useState("Serata Formale");
  const [qFabric, setQFabric] = useState("Velluto / Cashmere");
  const [qFit, setQFit] = useState("Sartoriale Slim");
  const [qColor, setQColor] = useState("#2563eb");
  const [qCity, setQCity] = useState(profileData?.city || "Brescia");
  const [busy, setBusy] = useState(false);

  if(!canAccess("wardrobe")) return html`<${LockedFeatureCard} title="ArmoWardrobe Digital" module="wardrobe" />`;

  const generateOutfitAI = async () => {
    if(!rtdb || !user) return;
    setBusy(true);
    try {
      const prompt = `Genera un capo d'abbigliamento digitale dettagliato per un utente ${userGender} a ${qCity}.
      Parametri: Tipo: ${qType}, Occasione: ${qOccasion}, Tessuto: ${qFabric}, Vestibilità: ${qFit}, Colore Hex: ${qColor}.
      Restituisci un JSON con campi: "name" (stringa elegante), "desc" (descrizione sartoriale di 2 frasi adattata al meteo).`;
      
      const res = await groq({
        messages: [{role:"system", content:"Rispondi solo in JSON valido."}, {role:"user", content: prompt}],
        json: true
      });
      const parsed = JSON.parse(res);

      await push(ref(rtdb, "wardrobe/"+user.uid), {
        name: parsed.name || `${qType} ${qOccasion}`,
        type: qType,
        occasion: qOccasion,
        fabric: qFabric,
        fit: qFit,
        colorHex: qColor,
        city: qCity,
        desc: parsed.desc || `Capo sartoriale per ${qCity} in ${qFabric}.`,
        season: profileData?.season || "inverno",
        createdAt: serverTimestamp()
      });
      setStep(1);
    } catch(e) {
      await push(ref(rtdb, "wardrobe/"+user.uid), {
        name: `${qType} - ${qOccasion}`,
        type: qType,
        colorHex: qColor,
        city: qCity,
        desc: `Capo generato per ${qCity} con finitura in ${qFabric}.`,
        createdAt: serverTimestamp()
      });
      setStep(1);
    } finally { setBusy(false); }
  };

  return html`
    <div class="space-y-6 max-w-4xl mx-auto">
      <div class="glass p-6 flex justify-between items-center">
        <div>
          <h2 class="text-xl font-serif font-bold text-white flex items-center gap-2">
            <${SvgIcon} name="wardrobe" className="w-6 h-6 text-sky-400" /> ArmoWardrobe Digital Generativo
          </h2>
          <p class="text-xs text-sky-200 mt-1">Generazione capo guidata da IA con dati meteo approssimativi di <b>${qCity}</b>.</p>
        </div>
        <button type="button" class="btn text-xs" onClick=${()=>setStep(2)}>+ Genera Capo Digital</button>
      </div>

      ${step === 2 && html`
        <div class="glass p-6 space-y-4 border border-sky-500/40">
          <h3 class="font-serif font-bold text-white text-base">Questionario Guidato Generazione Capo</h3>
          
          <div class="grid sm:grid-cols-2 gap-4 text-xs">
            <label class="block"><span class="text-slate-300">1. Tipo di Capo</span>
              <select class="field mt-1" value=${qType} onChange=${e=>setQType(e.target.value)}>
                <option value="Giacca/Cappotto">Giacca / Cappotto</option>
                <option value="Maglioncino/Cardigan">Maglioncino / Cardigan</option>
                <option value="Abito da Sera">Abito da Sera</option>
                <option value="Pantaloni/Gonna">Pantaloni / Gonna</option>
              </select>
            </label>

            <label class="block"><span class="text-slate-300">2. Occasione d'Uso</span>
              <select class="field mt-1" value=${qOccasion} onChange=${e=>setQOccasion(e.target.value)}>
                <option value="Serata Formale">Serata Formale</option>
                <option value="Business / Ufficio">Business / Ufficio</option>
                <option value="Casual Chic">Casual Chic</option>
              </select>
            </label>

            <label class="block"><span class="text-slate-300">3. Tessuto Sartoriale</span>
              <select class="field mt-1" value=${qFabric} onChange=${e=>setQFabric(e.target.value)}>
                <option value="Velluto / Cashmere">Velluto / Cashmere</option>
                <option value="Seta / Satèn">Seta / Satèn</option>
                <option value="Lana Vergine">Lana Vergine</option>
              </select>
            </label>

            <label class="block"><span class="text-slate-300">4. Vestibilità</span>
              <select class="field mt-1" value=${qFit} onChange=${e=>setQFit(e.target.value)}>
                <option value="Sartoriale Slim">Sartoriale Slim</option>
                <option value="Regular Fit">Regular Fit</option>
                <option value="Oversize">Oversize</option>
              </select>
            </label>

            <label class="block"><span class="text-slate-300">5. Posizione Approssimativa (Città)</span>
              <input class="field mt-1" value=${qCity} onInput=${e=>setQCity(e.target.value)}/>
            </label>

            <label class="block"><span class="text-slate-300">6. Colore Primario Capo</span>
              <input type="color" class="h-11 w-full rounded-2xl cursor-pointer bg-transparent mt-1" value=${qColor} onChange=${e=>setQColor(e.target.value)}/>
            </label>
          </div>

          <div class="flex gap-2 pt-2">
            <button type="button" class="btn flex-1" disabled=${busy} onClick=${generateOutfitAI}>Elabora & Salva Capo Digital</button>
            <button type="button" class="btn-ghost" onClick=${()=>setStep(1)}>Annulla</button>
          </div>
        </div>
      `}

      <div class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3">
        ${wardrobeItems.map(item => html`
          <div key=${item.id} class="glass p-5 space-y-3 border border-sky-500/20 flex flex-col justify-between">
            <div class="flex items-center gap-3">
              <div class="w-14 h-14 rounded-2xl flex items-center justify-center shadow-inner" style=${{backgroundColor: item.colorHex}}>
                <${SvgIcon} name="wardrobe" className="w-7 h-7 text-white drop-shadow"/>
              </div>
              <div>
                <h4 class="font-bold text-sm text-white">${item.name}</h4>
                <span class="text-[10px] text-sky-300 uppercase tracking-wider block">${item.type}</span>
                <span class="text-[9px] text-slate-400 font-mono">📍 ${item.city || 'Milano'}</span>
              </div>
            </div>
            <p class="text-xs text-slate-300 line-clamp-2">${item.desc}</p>
            <div class="pt-2 border-t border-sky-500/10 flex justify-between items-center">

                <${SvgIcon} name="trash" className="w-4 h-4"/>

function ExpertChatModule(){
  const {user, userTier, canAccess} = useApp();
  const [messages, setMessages] = useState([]);
  const [input, setInput] = useState("");
  const [lastStaffReplyTime, setLastStaffReplyTime] = useState(null);
  const [timeLeft, setTimeLeft] = useState(0);

  if(!canAccess("expert_chat")) return html`<${LockedFeatureCard} title="Consulenza Stylist" module="expert_chat" />`;

  useEffect(() => {
    if(!rtdb || !user) return;
    const chatRef = ref(rtdb, `expert_chats/${user.uid}/messages`);
    const unsub = onValue(chatRef, snap => {
      const v = snap.val();
      if(v) {
        const list = Object.keys(v).map(k => ({id:k, ...v[k]}));
        setMessages(list);
        const lastStaffMsg = [...list].reverse().find(m => m.sender === "staff");
        if(lastStaffMsg) setLastStaffReplyTime(lastStaffMsg.timestamp);
      }
    });
    return () => unsub();
  }, [user]);

  useEffect(() => {
    if(userTier !== "free" || !lastStaffReplyTime) return;
    const interval = setInterval(() => {
      const elapsed = (Date.now() - lastStaffReplyTime) / 1000;
      const remaining = Math.max(0, 300 - Math.floor(elapsed));
      setTimeLeft(remaining);
    }, 1000);
    return () => clearInterval(interval);
  }, [lastStaffReplyTime, userTier]);

  const send = async (e) => {
    e.preventDefault();
    if(!input.trim() || !rtdb || !user) return;
    if(userTier === "free" && lastStaffReplyTime && timeLeft <= 0) {
      alert("Il tempo di consulenza gratuita di 5 minuti è terminato. Fai upgrade a Pro per chat illimitata.");
      return;
    }

    const msgObj = {
      text: input,
      sender: "user",
      senderEmail: user.email,
      timestamp: serverTimestamp()
    };
    await push(ref(rtdb, `expert_chats/${user.uid}/messages`), msgObj);
    await update(ref(rtdb, `expert_chats/${user.uid}`), {
      lastMessage: input,
      lastUpdate: serverTimestamp(),
      userEmail: user.email
    });
    setInput("");
  };

  const formatTimer = (s) => {
    const m = Math.floor(s / 60);
    const sec = s % 60;
    return `${m}:${sec < 10 ? '0' : ''}${sec}`;
  };

  return html`
    <div class="glass max-w-3xl mx-auto flex flex-col h-[75vh] p-5 space-y-4 border border-sky-500/30">
      <div class="flex items-center justify-between pb-3 border-b border-sky-500/20">
        <div class="flex items-center gap-3">
          <${SvgIcon} name="chat" className="w-6 h-6 text-sky-400" />
          <div>
            <h2 class="font-serif font-bold text-white">Consulenza Diretta con lo Stylist</h2>
            <span class="text-[10px] text-slate-400">Supporto Armocromatico Sartoriale In Tempo Reale</span>
          </div>
        </div>

        ${userTier === "free" && html`
          <div class="px-3 py-1 rounded-xl bg-blue-950/80 border border-sky-500/40 text-sky-300 text-xs font-mono font-bold">
            ⏱ Timer Freemium: ${timeLeft > 0 ? formatTimer(timeLeft) : "Scaduto (Upgrade Pro)"}
          </div>
        `}
      </div>

      <div class="flex-1 overflow-y-auto space-y-3 pr-2 text-xs custom-scrollbar">
        ${messages.length === 0 ? html`
          <div class="text-center text-slate-400 py-12">Nessun messaggio inviato. Scrivi un messaggio allo Stylist Horizon per iniziare.</div>
        ` : messages.map(m => html`
          <div key=${m.id} class="p-3 rounded-2xl max-w-[80%] ${m.sender==='user'?'ml-auto on text-white':'bg-slate-900 border border-sky-500/20 text-slate-200'}">
            <span class="text-[9px] text-sky-300 font-bold block mb-1">${m.sender==='user'?'Tu':'Stylist Landra'}</span>
            <p>${m.text}</p>
          </div>
        `)}
      </div>

      <form class="flex gap-2" onSubmit=${send}>
        <input class="field" placeholder="Scrivi al tuo Stylist..." value=${input} onInput=${e=>setInput(e.target.value)}/>
        <button type="submit" class="btn" disabled=${userTier === "free" && lastStaffReplyTime && timeLeft <= 0}>Invia</button>
      </form>
    </div>
  `;
}

                  <tbody class="divide-y divide-slate-800">
                    ${SYSTEM_MODULES.map(m => html`
                      <tr key=${m.id} class="hover:bg-slate-950/50">
                        <td class="p-3">
                          <span class="font-bold text-white block">${m.name}</span>
                          <span class="text-[10px] text-slate-400 block">${m.desc}</span>
                        </td>
                        ${["free", "pro", "plus"].map(t => {
                          const active = (permMatrix[t] || []).includes(m.id);
                          return html`
                            <td key=${t} class="p-3 text-center">
                              <input type="checkbox" checked=${active} onChange=${()=>togglePermission(t, m.id)} class="w-4 h-4 accent-cyan-500 cursor-pointer"/>
                            </td>
                          `;
                        })}
                      </tr>
                    `)}
                  </tbody>
                </table>
              </div>
            </div>

            <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl space-y-4 max-w-md">
              <h3 class="font-bold text-white text-lg">Listino Prezzi Abbonamenti</h3>
              <label class="block text-xs text-slate-300">Prezzo Piano Pro (€/mese)
                <input class="field bg-slate-950 border-slate-800 mt-1" value=${pPro} onInput=${e=>setPPro(e.target.value)}/>
              </label>
              <label class="block text-xs text-slate-300">Prezzo Piano Plus (€/mese)
                <input class="field bg-slate-950 border-slate-800 mt-1" value=${pPlus} onInput=${e=>setPPlus(e.target.value)}/>
              </label>
              <button type="button" class="btn bg-cyan-600 hover:bg-cyan-500" onClick=${savePricing}>Salva Listino Prezzi</button>
            </div>
          </div>
        `}

        ${tab==='horizon_support' && html`
          <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl space-y-4 max-w-3xl flex flex-col h-[75vh]">
            <div class="border-b border-slate-800 pb-3 flex items-center justify-between">
              <div>
                <h3 class="font-bold text-white text-lg flex items-center gap-2">
                  <${SvgIcon} name="horizon" className="w-6 h-6 text-cyan-400"/> Assistenza Horizon Core ID (Database Secondario)
                </h3>
                <span class="text-[10px] font-mono text-cyan-400">Canale Cifrato Staff Horizon OS: horizon-id-core</span>
              </div>
              <span class="text-xs font-mono text-sky-400 bg-blue-950/80 px-2.5 py-1 rounded-lg border border-sky-800">
                Core ID: ${generatedCoreUserId}
              </span>
            </div>

            <div class="flex-1 overflow-y-auto space-y-2 pr-2 text-xs custom-scrollbar">
              ${horizonSupportMsgs.filter(m => !m.hiddenFromAdmin).map(m => html`
                <div key=${m.id} class="p-3 rounded-xl max-w-[80%] ${m.sender==='LandraAdmin'?'ml-auto bg-cyan-600 text-white':'bg-slate-950 border border-slate-800 text-slate-300'}">
                  <span class="text-[9px] text-cyan-300 font-mono font-bold block mb-1">${m.sender}</span>
                  <p>${m.text}</p>
                </div>
              `)}
            </div>

            <form class="flex gap-2 pt-3 border-t border-slate-800" onSubmit=${sendHorizonSupportCore}>
              <input class="field bg-slate-950 border-slate-800" placeholder="Scrivi al supporto con il tuo Core ID generato..." value=${horizonInput} onInput=${e=>setHorizonInput(e.target.value)}/>
              <button type="submit" class="btn bg-cyan-600 hover:bg-cyan-500">Invia su Core ID</button>
            </form>
          </div>
        `}

        ${tab==='social' && html`
          <div class="space-y-6">
            <h2 class="text-xl font-bold text-white">Gestione Social Page & Storie (Auto-scadenza 24h)</h2>

            <div class="grid lg:grid-cols-2 gap-6">
              <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl space-y-4">
                <h3 class="font-bold text-cyan-400 text-sm">Pubblica Post nella Social Page</h3>
                <textarea class="field bg-slate-950 border-slate-800" rows="3" placeholder="Didascalia post..." value=${socialCaption} onInput=${e=>setSocialCaption(e.target.value)}></textarea>
                <input type="file" class="field bg-slate-950 border-slate-800 text-xs" accept="image/*" onChange=${e=>setSocialFile(e.target.files[0])}/>
                <button type="button" class="btn bg-cyan-600 hover:bg-cyan-500 w-full" onClick=${saveSocialPost}>Pubblica Post Social</button>

                <div class="pt-4 border-t border-slate-800 space-y-2">
                  <h4 class="font-bold text-white text-xs">Post Social Esistenti (${socialPosts.length})</h4>
                  <div class="space-y-2 max-h-60 overflow-y-auto custom-scrollbar">
                    ${socialPosts.map(p => html`
                      <div key=${p.id} class="flex justify-between items-center p-3 bg-slate-950 rounded-xl text-xs border border-slate-800">
                        <span class="truncate max-w-xs text-slate-300">${p.caption}</span>
                        <button type="button" class="text-red-400 hover:text-red-300" onClick=${()=>remove(ref(rtdb, "socialPosts/"+p.id))}>Elimina</button>
                      </div>
                    `)}
                  </div>
                </div>
              </div>

              <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl space-y-4">
                <h3 class="font-bold text-cyan-400 text-sm">Aggiungi Storie (Auto-eliminazione 24h)</h3>
                <input class="field bg-slate-950 border-slate-800" placeholder="Titolo Storia" value=${storyTitle} onInput=${e=>setStoryTitle(e.target.value)}/>
                <input type="file" class="field bg-slate-950 border-slate-800 text-xs" accept="image/*" onChange=${e=>setStoryFile(e.target.files[0])}/>
                <button type="button" class="btn bg-cyan-600 hover:bg-cyan-500 w-full" onClick=${saveStory}>Pubblica Storia</button>

                <div class="pt-4 border-t border-slate-800 space-y-2">
                  <h4 class="font-bold text-white text-xs">Storie Attive (${stories.length})</h4>
                  <div class="grid grid-cols-2 gap-2 max-h-60 overflow-y-auto custom-scrollbar">
                    ${stories.map(s => html`
                      <div key=${s.id} class="flex items-center justify-between p-2 bg-slate-950 rounded-xl border border-slate-800">
                        <span class="text-xs text-slate-200 truncate">${s.title}</span>
                        <button type="button" class="text-red-400 hover:text-red-300 text-xs ml-2" onClick=${()=>remove(ref(rtdb, "stories/"+s.id))}>Elimina</button>
                      </div>
                    `)}
                  </div>
                </div>
              </div>
            </div>
          </div>
        `}

        ${tab==='articles' && html`
          <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl space-y-4 max-w-3xl">
            <h3 class="font-bold text-white text-lg">📰 Gestione Esclusiva Feed Articoli (Controllo Editoriale Admin)</h3>
            <p class="text-xs text-slate-400">Gli articoli scritti o pubblicati manualmente da te hier vengono automaticamente impostati <b>In Evidenza (Sticky)</b> per le prime 12 ore, a differenza dei post generati dall'IA.</p>
            
            <input class="field bg-slate-950 border-slate-800" placeholder="Titolo articolo" value=${artTitle} onInput=${e=>setArtTitle(e.target.value)}/>
            <input class="field bg-slate-950 border-slate-800" placeholder="Estratto breve" value=${artExcerpt} onInput=${e=>setArtExcerpt(e.target.value)}/>
            <div class="grid grid-cols-2 gap-3">
              <select class="field bg-slate-950 border-slate-800" value=${artSeason} onChange=${e=>setArtSeason(e.target.value)}>
                ${SEASONS.map(s=>html`<option key=${s} value=${s}>Stagione: ${s}</option>`)}
              </select>
              <select class="field bg-slate-950 border-slate-800" value=${artGender} onChange=${e=>setArtGender(e.target.value)}>
                ${TARGET_GENDERS.map(g=>html`<option key=${g} value=${g}>Target Sesso: ${g}</option>`)}
              </select>
            </div>
            <input type="file" class="field bg-slate-950 border-slate-800 text-xs" accept="image/*" onChange=${e=>setArtFile(e.target.files[0])}/>
            <textarea class="field bg-slate-950 border-slate-800" rows="5" placeholder="Contenuto editoriale..." value=${artBody} onInput=${e=>setArtBody(e.target.value)}></textarea>
            <button type="button" class="btn bg-cyan-600 hover:bg-cyan-500" onClick=${saveArticle}>Pubblica & Fissa nel Feed (12h)</button>

            <div class="pt-6 border-t border-slate-800 space-y-2">
              <h4 class="font-bold text-white text-sm">Articoli Esistenti Nel Feed (${articles.length})</h4>
              ${articles.map(a => html`
                <div key=${a.id} class="flex justify-between items-center p-3 bg-slate-950 rounded-lg text-xs border border-slate-800">
                  <span class="text-slate-300 flex items-center gap-2">
                    ${a.isPinned && html`<span class="text-sky-400 font-bold">📌 [Sticky Admin 12h]</span>`}
                    ${a.title?.it || a.title} (${a.season})
                  </span>
                  <button type="button" class="text-red-400 hover:text-red-300" onClick=${()=>remove(ref(rtdb, "articles/"+a.id))}>Elimina</button>
                </div>
              `)}
            </div>
          </div>
        `}

        ${tab==='shop' && html`
          <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl space-y-4 max-w-3xl">
            <h3 class="font-bold text-white text-lg">🛍️ Gestione Esclusiva Sezione Shop Mirato</h3>
            <p class="text-xs text-slate-400">Gestisci i prodotti e i capi sartoriali in vetrina separatamente dal Feed editoriale.</p>

            <input class="field bg-slate-950 border-slate-800" placeholder="Nome Prodotto / Capo" value=${prodName} onInput=${e=>setProdName(e.target.value)}/>
            <div class="grid grid-cols-2 gap-3">
              <input class="field bg-slate-950 border-slate-800" type="number" placeholder="Prezzo (€)" value=${prodPrice} onInput=${e=>setProdPrice(e.target.value)}/>
              <input class="field bg-slate-950 border-slate-800" placeholder="Link Acquisto (opzionale)" value=${prodLink} onInput=${e=>setProdLink(e.target.value)}/>
            </div>
            <div class="grid grid-cols-2 gap-3">
              <select class="field bg-slate-950 border-slate-800" value=${prodSeason} onChange=${e=>setProdSeason(e.target.value)}>
                ${SEASONS.map(s=>html`<option key=${s} value=${s}>Stagione Shop: ${s}</option>`)}
              </select>
              <select class="field bg-slate-950 border-slate-800" value=${prodGender} onChange=${e=>setProdGender(e.target.value)}>
                ${TARGET_GENDERS.map(g=>html`<option key=${g} value=${g}>Target Sesso: ${g}</option>`)}
              </select>
            </div>
            <input type="file" class="field bg-slate-950 border-slate-800 text-xs" accept="image/*" onChange=${e=>setProdFile(e.target.files[0])}/>
            <button type="button" class="btn bg-cyan-600 hover:bg-cyan-500" onClick=${saveProduct}>Carica Prodotto nello Shop</button>

            <div class="pt-6 border-t border-slate-800 space-y-2">
              <h4 class="font-bold text-white text-sm">Prodotti Attivi nello Shop (${products.length})</h4>
              ${products.map(p => html`
                <div key=${p.id} class="flex justify-between items-center p-3 bg-slate-950 rounded-lg text-xs border border-slate-800">
                  <span class="text-slate-300">
                    <b>${p.name}</b> — €${Number(p.price||0).toFixed(2)} (${p.season} / ${p.targetGender})
                  </span>
                  <button type="button" class="text-red-400 hover:text-red-300" onClick=${()=>remove(ref(rtdb, "products/"+p.id))}>Elimina</button>
                </div>
              `)}
            </div>
          </div>
        `}
      </main>
    </div>
  `;
}

function Shell(){
  const {isStaff, userTier, setCheckoutTier} = useApp();
  const [tab, setTab] = useState("feed");
  const [startOpen, setStartOpen] = useState(false);
  const [dropdownOpen, setDropdownOpen] = useState(false);
  const [hash, setHash] = useState(location.hash);

  useEffect(() => {
    const h = () => setHash(location.hash);
    addEventListener("hashchange", h);
    return () => removeEventListener("hashchange", h);
  }, []);

  if(hash === "#staff") return html`<${CmsDashboard}/>`;

  const openTab = (t) => { setTab(t); setStartOpen(false); setDropdownOpen(false); };

  return html`
    <div class="flex min-h-screen flex-col">
      <header class="glass sticky top-0 z-30 flex items-center justify-between px-6 py-3 border-b border-sky-500/30">
        <${BrandLogo}/>

        <nav class="hidden md:flex items-center gap-2 relative">
          <button type="button" class="btn-ghost ${tab==='feed'?'on':''}" onClick=${()=>setTab('feed')}>Home Editorial</button>
          <button type="button" class="btn-ghost ${tab==='social'?'on':''}" onClick=${()=>setTab('social')}>Social Page</button>
          <button type="button" class="btn-ghost ${tab==='mannequin'?'on':''}" onClick=${()=>setTab('mannequin')}>Manichino Vettoriale</button>

          <div class="relative">
            <button type="button" class="btn-ghost flex items-center gap-1" onClick=${()=>setDropdownOpen(!dropdownOpen)}>
              Moduli ▾
            </button>
            ${dropdownOpen && html`
              <div class="fixed inset-0 z-40" onClick=${()=>setDropdownOpen(false)}></div>
              <div class="absolute top-full left-1/2 -translate-x-1/2 mt-2 w-64 glass glass-strong p-2 space-y-1 shadow-2xl z-50 border border-sky-500/40">
                ${SYSTEM_MODULES.map(m => html`
                  <button type="button" key=${m.id} class="w-full text-left p-2.5 rounded-xl text-xs hover:bg-sky-500/20 text-slate-200 transition flex items-center justify-between" onClick=${()=>openTab(m.id)}>
                    <span>${m.name}</span>
                    <${SvgIcon} name=${m.id} className="w-4 h-4 text-sky-400"/>
                  </button>
                `)}
              </div>
            `}
          </div>
        </nav>

        <div class="flex items-center gap-2">
          <button type="button" class="btn-ghost text-xs uppercase tracking-wider text-sky-300 font-bold" onClick=${()=>setCheckoutTier(userTier==='free'?'pro':userTier)}>
            💎 ${userTier}
          </button>
          ${isStaff && html`<a href="#staff" class="btn-ghost text-xs bg-cyan-950/80 border-cyan-700 text-cyan-300 font-mono">Horizon CMS</a>`}
          <button type="button" class="btn-ghost" onClick=${()=>signOut(auth)}>Esci</button>
        </div>
      </header>

      <main class="mx-auto w-full max-w-[1200px] flex-1 px-4 pt-6 pb-32">
        ${tab==='feed' && html`<${FeedModule} onSwitchTab=${(t)=>setTab(t)}/>`}
        ${tab==='social' && html`<${SocialPageModule}/>`}
        ${tab==='mannequin' && html`<${MannequinStudioModule}/>`}
        ${tab==='wardrobe' && html`<${WardrobeModule}/>`}
        ${tab==='orion' && html`<${OrionChatModule}/>`}
        ${tab==='video' && html`<${VideoMasterclassModule}/>`}
        ${tab==='expert_chat' && html`<${ExpertChatModule}/>`}
        ${tab==='videocall' && html`<${VideocallBookingModule}/>`}
        ${tab==='info' && html`<${InfoModule}/>`}
        ${tab==='profile' && html`<${ProfileModule}/>`}
      </main>

      ${startOpen && html`
        <div class="fixed inset-0 z-40 bg-black/60 backdrop-blur-sm md:hidden" onClick=${()=>setStartOpen(false)}>
          <div class="fixed bottom-20 left-4 right-4 glass glass-strong p-5 space-y-4 border border-sky-500/40" onClick=${e=>e.stopPropagation()}>
            <div class="flex items-center justify-between border-b border-sky-500/20 pb-3">
              <${BrandLogo}/>
              <span class="text-[10px] text-sky-400 font-bold uppercase">Menu Start</span>
            </div>
            <div class="grid grid-cols-3 gap-3">
              ${SYSTEM_MODULES.map(m => html`
                <button type="button" key=${m.id} class="glass p-3 flex flex-col items-center justify-center text-center space-y-1.5 cursor-pointer" onClick=${()=>openTab(m.id)}>
                  <${SvgIcon} name=${m.id} className="w-6 h-6 text-sky-400" />
                  <span class="text-[10px] font-bold text-white">${m.name}</span>
                </button>
              `)}
            </div>
          </div>
        </div>
      `}

      <nav class="glass fixed inset-x-4 bottom-4 z-40 flex items-center justify-around p-2 md:hidden border border-sky-500/30 safe-bottom">
        <button type="button" class="flex flex-col items-center p-2 ${tab==='feed'?'text-sky-400':'text-slate-400'}" onClick=${()=>setTab('feed')}>
          <${SvgIcon} name="home" className="w-5 h-5"/><span class="text-[9px]">Home</span>
        </button>
        <button type="button" class="flex flex-col items-center p-2 ${tab==='social'?'text-sky-400':'text-slate-400'}" onClick=${()=>setTab('social')}>
          <${SvgIcon} name="social" className="w-5 h-5"/><span class="text-[9px]">Social</span>
        </button>

        <button type="button" class="relative -top-4 w-14 h-14 rounded-full bg-gradient-to-tr from-blue-600 via-indigo-600 to-sky-400 p-0.5 shadow-2xl flex items-center justify-center" onClick=${()=>setStartOpen(!startOpen)}>
          <div class="w-full h-full rounded-full bg-slate-950 flex items-center justify-center">
            <${SvgIcon} name="grid" className="w-6 h-6 text-sky-400" />
          </div>
        </button>

        <button type="button" class="flex flex-col items-center p-2 ${tab==='mannequin'?'text-sky-400':'text-slate-400'}" onClick=${()=>setTab('mannequin')}>
          <${SvgIcon} name="mannequin" className="w-5 h-5"/><span class="text-[9px]">Vettoriale</span>
        </button>
        <button type="button" class="flex flex-col items-center p-2 ${tab==='profile'?'text-sky-400':'text-slate-400'}" onClick=${()=>setTab('profile')}>
          <${SvgIcon} name="profile" className="w-5 h-5"/><span class="text-[9px]">Profilo</span>
        </button>
      </nav>

      <${PayPalCheckoutModal}/>
    </div>
  `;
}

function Main(){
  const {profileData} = useApp();
  if(!profileData?.onboarded) return html`<${IntakeSurvey} onDone=${()=>window.location.reload()}/>`;
  return html`<${Shell}/>`;
}

function App(){
  return html`
    <${Providers}>
      <${AuthGate}>
        <${Main}/>
      <//>
    <//>
  `;
}

render(html`<${App}/>`, document.getElementById("app"));
</script>
</body>
</html>
