<!-- CATTURA PRECOCE beforeinstallprompt (script classico: l'evento non va mai perso) -->
<script>
window.__deferredPrompt = null;
window.addEventListener('beforeinstallprompt', function(e) {
  e.preventDefault();
  window.__deferredPrompt = e;
  window.__bipFired = true;
  // se Chrome offre l'installazione, l'app NON è installata: azzera il ricordo
  try { localStorage.removeItem('lf_pwa_installed'); } catch (err) {}
  window.dispatchEvent(new Event('pwa-prompt-ready'));
});
window.addEventListener('appinstalled', function() {
  // App installata: la scheda del browser RESTA BLOCCATA, si usa solo la PWA
  window.__deferredPrompt = null;
  try { localStorage.setItem('lf_pwa_installed', '1'); } catch (err) {}
  window.dispatchEvent(new Event('pwa-installed-now'));
});
</script>

function detectOSAndVersion() {
  const ua = navigator.userAgent || navigator.vendor || window.opera;
  let os = "Desktop";
  let version = "";

  if (/OrionOS/i.test(ua)) {
    os = "OrionOS";
  } else if (/android/i.test(ua)) {
    os = "Android";
    const match = ua.match(/Android\s([0-9\.]+)/);
    if (match) version = match[1];
  } else if ((/iPad|iPhone|iPod/.test(ua) && !window.MSStream) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1)) {
    os = "iOS";
    const match = ua.match(/OS\s([\d_]+)/);
    if (match) version = match[1].replace(/_/g, '.');
  } else if (/Macintosh|MacIntel|MacPPC|Mac68K/.test(ua)) {
    os = "macOS";
    const match = ua.match(/Mac OS X\s([\d_]+)/);
    if (match) version = match[1].replace(/_/g, '.');
  } else if (/Win/.test(ua)) {
    os = "Windows";
  } else if (/OrionOS/i.test(ua)) {
    os = "OrionOS";
  } else if (/Linux|X11|CrOS/.test(ua)) {
    os = "Linux";
  }
  return { os, version };
}

    const plusSvg = '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3.5" y="3.5" width="17" height="17" rx="4"/><path d="M12 8v8M8 12h8"/></svg>';

async function runPWADiagnostics() {
  const ok = t => `<div>✅ ${t}</div>`, ko = t => `<div>❌ ${t}</div>`, wn = t => `<div>⚠️ ${t}</div>`;
  let out = [];
  try {
    const secure = window.isSecureContext;
    out.push(secure ? ok("Connessione sicura (HTTPS)") : ko("Pagina NON in HTTPS: Chrome non permette l'installazione"));

    if (window.matchMedia('(display-mode: standalone)').matches) out.push(wn("Sei già dentro l'app installata"));

    try {
      if (navigator.getInstalledRelatedApps) {
        const rel = await navigator.getInstalledRelatedApps();
        if (rel && rel.length) out.push(wn("App già installata su questo dispositivo: aprila dall'icona sul desktop/menu Start (Chrome non offre di nuovo l'installazione)"));
      }
    } catch (e) {}

    const link = document.querySelector('link[rel="manifest"]');
    if (!link) {
      out.push(ko("Tag &lt;link rel=manifest&gt; mancante"));
    } else {
      try {
        const r = await fetch(link.href, { cache: 'no-store' });
        if (!r.ok) {
          out.push(ko("manifest.json non raggiungibile (errore " + r.status + ") → controlla che sia caricato accanto a index.html"));
        } else {
          let m = null;
          try { m = await r.json(); } catch (e) { out.push(ko("manifest.json non è un JSON valido")); }
          if (m) {
            out.push(ok("manifest.json letto correttamente"));
            if (!m.name && !m.short_name) out.push(ko("Manifest senza name"));
            if (m.display !== 'standalone' && m.display !== 'fullscreen' && m.display !== 'minimal-ui') out.push(ko("display non valido"));
            const icons = m.icons || [];
            for (const ic of icons) {
              try {
                const u = new URL(ic.src, link.href).href;
                const ir = await fetch(u, { cache: 'no-store' });
                const ct = ir.headers.get('content-type') || '';
                if (ir.ok && ct.indexOf('image') === 0) out.push(ok("Icona " + ic.sizes + " trovata"));
                else out.push(ko("Icona " + ic.sizes + " NON trovata (" + ir.status + ") → carica la cartella <b>icone</b> con " + ic.src.replace('./','')));
              } catch (e) { out.push(ko("Icona " + ic.sizes + " non raggiungibile")); }
            }
          }
        }
      } catch (e) { out.push(ko("Impossibile leggere manifest.json")); }
    }

    if (!('serviceWorker' in navigator)) {
      out.push(ko("Service worker non supportato in questo browser"));
    } else {
      const reg = await navigator.serviceWorker.getRegistration();
      if (!reg) out.push(ko("Service worker NON registrato → controlla che sw.js sia caricato accanto a index.html"));
      else if (reg.active) out.push(ok("Service worker attivo"));
      else out.push(wn("Service worker in attivazione: ricarica la pagina tra qualche secondo"));
    }

    const ua = navigator.userAgent;
    if (/Firefox\//.test(ua) && !/Android/.test(ua)) out.push(ko("Firefox desktop non supporta l'installazione diretta: usa Chrome o Edge"));
    if (/Safari\//.test(ua) && !/Chrome|Chromium|Edg|CriOS|Android/.test(ua)) out.push(wn("Safari: usa Condivisione → Aggiungi alla schermata Home"));
  } catch (e) {
    out.push(ko("Diagnostica fallita: " + e.message));
  }
  out.push(window.__bipFired ? ok("Chrome ha inviato l'evento di installazione") : ko("Chrome NON ha inviato l'evento di installazione: la pagina è a posto, è il browser a non offrirlo (app già installata, installazione rifiutata in passato, finestra anonima o profilo ospite)"));
  out.push('<div class="pt-2 opacity-80">Se tutto è ✅ ma il bottone non parte: ricarica con Ctrl+Shift+R, oppure menu ⋮ → <b>Installa LandraFashion</b>.</div>');
  return '<div class="space-y-1">' + out.join('') + '</div>';
}

});
</script>

(() => {
  const c = document.getElementById("fx");
  if(!c) return;
  const x = c.getContext("2d");
  let W, H;
  const rs = () => { W = c.width = innerWidth; H = c.height = innerHeight; };
  rs();
  addEventListener("resize", rs);
  const P = Array.from({length: 90}, () => ({x: Math.random()*2400, y: Math.random()*1400, r: Math.random()*2.6+0.8, s: Math.random()*0.4+0.1, t: Math.random()*6}));
  (function f(){
    x.clearRect(0,0,W,H);
    for(const p of P){
      p.y += p.s; p.t += 0.01; p.x += Math.sin(p.t)*0.2;
      if(p.y > H+5){ p.y = -5; p.x = Math.random()*W; }
      x.globalAlpha = 0.8; x.fillStyle = p.r>2?"#ffffff":"#cfe6ff";
      x.beginPath(); x.arc(p.x%W, p.y, p.r, 0, 7); x.fill();
    }
    requestAnimationFrame(f);
  })();
})();

async function groq({messages, json, maxTokens=3000, temperature=.6}){
  const body = {model: CFG.TEXT, messages, temperature, max_tokens: maxTokens};
  if(json) body.response_format = {type: "json_object"};
  const r = await fetch("https://api.groq.com/openai/v1/chat/completions", {
    method: "POST",
    headers: {"Authorization": "Bearer "+CFG.GROQ_KEY, "Content-Type": "application/json"},
    body: JSON.stringify(body)
  });
  if(!r.ok) throw Error("Errore chiamata Groq AI");
  const j = await r.json();
  return (j.choices[0].message.content||"").trim();
}

async function uploadToCloudinary(file) {
  try {
    const fd = new FormData();
    fd.append("file", file);
    fd.append("upload_preset", CFG.CLOUD_PRESET);
    const r = await fetch(`https://api.cloudinary.com/v1_1/${CFG.CLOUD_NAME}/image/upload`, { method: "POST", body: fd });
    if(r.ok) {
      const data = await r.json();
      return data.secure_url;
    }
  } catch(e) { console.warn("Cloudinary upload fallback:", e); }
  return new Promise((resolve) => {
    const reader = new FileReader();
    reader.onloadend = () => resolve(reader.result);
    reader.readAsDataURL(file);
  });
}

      else {

          "sp1": {id:"sp1", author:"LandraFashion Studio", caption:"❄️ Sfilata Capsule Invernale: Velluti profondi, sfumature bordeaux e dettagli oro metallico per sublimare la stagione fredda.", mediaUrl:"https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?w=900", likes:{}},
          "sp2": {id:"sp2", author:"Landra AI Atelier", caption:"✨ Prova contrasto sottotono: Abbinamenti strategici e palette zaffiro ideali per l'Inverno Brillante.", mediaUrl:"https://images.unsplash.com/photo-1490481651871-ab68de25d43d?w=900", likes:{}},

        };
        set(ref(rtdb, "socialPosts"), defaultPosts);
      }
    });

    onValue(ref(rtdb, "stories"), snap => {
      const v = snap.val();
      if(v) {
        const now = Date.now();
        const validStories = [];
        Object.keys(v).forEach(id => {
          const s = { id, ...v[id] };
          if(s.createdAt && (now - s.createdAt > 24 * 60 * 60 * 1000)) {
            remove(ref(rtdb, `stories/${id}`));
          } else {
            validStories.push(s);
          }
        });
        setStories(validStories);
      } else {
        const defaultStories = {
          "st1": {id:"st1", title:"Capsule Capodanno", imageUrl:"https://images.unsplash.com/photo-1512436991641-6745cdb1723f?w=500", createdAt: Date.now()},
          "st2": {id:"st2", title:"Make-up Freddo", imageUrl:"https://images.unsplash.com/photo-1487412720507-e7ab37603c6f?w=500", createdAt: Date.now()},
          "st3": {id:"st3", title:"Gioielli Argento", imageUrl:"https://images.unsplash.com/photo-1539109136881-3be0616acf4b?w=500", createdAt: Date.now()}
        };
        set(ref(rtdb, "stories"), defaultStories);
      }
    });

    onValue(ref(rtdb, "articles"), snap => {
      const v = snap.val();
      if(v) {
        const now = Date.now();
        const list = Object.keys(v).map(id => {
          const item = { id, ...v[id] };
          if(item.isPinned && item.createdAt && (now - item.createdAt > 12 * 60 * 60 * 1000)) {
            item.isPinned = false;
            update(ref(rtdb, `articles/${id}`), { isPinned: false });
          }
          return item;
        });
        setArticles(list);
      } else {
        const defaultArts = {

        };
        set(ref(rtdb, "articles"), defaultArts);
      }
    });

    onValue(ref(rtdb, "products"), snap => {
      const v = snap.val();
      if(v) setProducts(Object.keys(v).map(id => ({id, ...v[id]})));
      else {
        setProducts([
          {id:"prod1", name:"Blazer Velluto Zaffiro", price:189, season:"inverno", targetGender:"Donna", imageUrl:"https://images.unsplash.com/photo-1490481651871-ab68de25d43d?w=800", link:"#"}
        ]);
      }
    });

    onValue(ref(rtdb, "transactions"), snap => {
      const v = snap.val();
      if(v) setTransactions(Object.keys(v).map(id => ({id, ...v[id]})));
    });

    onValue(ref(rtdb, "pricing"), snap => { if(snap.val()) setPricing(snap.val()); });
    
    onValue(ref(rtdb, "permissions"), snap => {
      if(snap.val()) setPermissions(snap.val());
      else set(ref(rtdb, "permissions"), DEFAULT_FEATURE_PERMISSIONS);
    });
  }, []);

  const isStaff = user?.email?.toLowerCase() === CFG.STAFF_EMAIL.toLowerCase();
  const userTier = profileData?.tier || "free";
  const userGender = profileData?.gender || "Donna";

  const canAccess = (moduleId) => {
    if(isStaff) return true;
    const allowed = permissions[userTier] || DEFAULT_FEATURE_PERMISSIONS[userTier] || [];
    return allowed.includes(moduleId);
  };

  return html`
    <${AppState.Provider} value=${{
      user, isStaff, authReady, profileLoaded, profileData, articles, products, socialPosts, stories, videos, videoCategories,
      pricing, permissions, wardrobeItems, userTier, userGender, canAccess, checkoutTier, setCheckoutTier,
      transactions, videocallTariffs, autoConfig, loadFailed
    }}>
      ${children}
    <//>
  `;
}

function AuthGate({children}){
  const {user, authReady} = useApp();
  const [isReg, setIsReg] = useState(false);
  const [email, setEmail] = useState("");
  const [pass, setPass] = useState("");
  const [acceptGdpr, setAcceptGdpr] = useState(false);
  const [err, setErr] = useState("");
  const [busy, setBusy] = useState(false);

  if(!authReady) return html`<${LoadingScreen}/>`;
  if(user) return children;

  const submit = async e => {
    e.preventDefault();
    if(isReg && !acceptGdpr) { setErr("È necessario accettare le condizioni GDPR."); return; }
    setErr(""); setBusy(true);
    try {
      if(isReg) {
        const c = await createUserWithEmailAndPassword(auth, email, pass);
        if(rtdb) await set(ref(rtdb, "users/"+c.user.uid), {email, acceptGdpr, tier: "free", onboarded: false, createdAt: serverTimestamp()});
      } else {
        await signInWithEmailAndPassword(auth, email, pass);
      }
    } catch(x) { setErr(x.message.replace("Firebase: ", "")); }
    finally { setBusy(false); }
  };

  return html`
    <div class="grid min-h-screen place-items-center p-4">
      <form onSubmit=${submit} class="glass glass-strong w-full max-w-md space-y-4 p-8 border border-sky-500/30">
        <div class="flex items-center justify-center mb-2"><${BrandLogo}/></div>
        <h1 class="text-xl font-serif font-bold text-white text-center">Accedi a LandraFashion</h1>
        <p class="text-xs text-slate-300 text-center">Armocromia & Intelligenza Artificiale Orion</p>
        
        <input class="field" type="email" required placeholder="Email" value=${email} onInput=${e=>setEmail(e.target.value)}/>
        <input class="field" type="password" required minlength="6" placeholder="Password" value=${pass} onInput=${e=>setPass(e.target.value)}/>
        
        ${isReg && html`
          <label class="flex items-start gap-2 cursor-pointer text-xs text-slate-300 pt-2 border-t border-sky-500/20">
            <input type="checkbox" required checked=${acceptGdpr} onChange=${e=>setAcceptGdpr(e.target.checked)} class="mt-0.5 accent-sky-500"/>
            <span>Accetto il trattamento dati GDPR Horizon Datacenter.</span>
          </label>
        `}

        ${err && html`<p class="text-xs text-red-400 text-center">${err}</p>`}
        <button type="submit" class="btn w-full" disabled=${busy}>${isReg?"Registrati":"Accedi"}</button>
        <button type="button" class="w-full text-xs text-sky-400 bg-transparent border-0 cursor-pointer text-center" onClick=${()=>setIsReg(!isReg)}>
          ${isReg?"Hai già un account? Accedi":"Non hai un account? Registrati"}
        </button>
      </form>
    </div>
  `;
}

function IntakeSurvey({onDone}){
  const {user} = useApp();
  const [step, setStep] = useState(1);
  const totalSteps = 6;

  const [f, setF] = useState({
    // Step 1: Base & Localizzazione
    gender: "Donna",
    city: "Milano",
    // Step 2: Incarnato & Sottotono
    skinTone: "Chiara / Porcellana",
    sunReaction: "Mi scotto facilmente, bronzo lento",
    veinsColor: "Blu / VIola (Cool)",
    redness: "Frequenti (Pelle sensibile o rosacea)",
    // Step 3: Occhi & Iride
    eyeColor: "Marrone Scuro / Nero",
    eyeFlecks: "Nessuna sfumatura, iride omogenea",
    eyeContrast: "Alto contrasto (Bianco sclera brillante)",
    // Step 4: Capelli & Riflessi
    hairNatural: "Castano Scuro / Bruno",
    hairReflections: "Cenere / Freddi / Nessuno",
    // Step 5: Contrasto & Valore Sovrano
    overallContrast: "Alto (Contrasto forte pelle/occhi/capelli)",
    overallValue: "Scuro / Intenso (Deep)",
    // Step 6: Risposta ai Colori & Metalli
    metalPreference: "Argento / Platino (Freddo)",
    colorReaction: "Nero e colori saturi mi illuminano",
    worstColor: "Arancio caldo e senape mi ingrigiscono"
  });

  const [busy, setBusy] = useState(false);

  // Calcolo scientifico preciso della stagione armocromatica in base ai dati inseriti
  const calculateSeason = () => {
    let warmScore = 0;
    let coolScore = 0;
    let deepScore = 0;
    let lightScore = 0;

    // Sottotono
    if(f.veinsColor.includes("Verdi")) warmScore += 2;
    if(f.veinsColor.includes("Blu")) coolScore += 2;
    if(f.sunReaction.includes("Abbronzatura dorata")) warmScore += 1.5;
    if(f.sunReaction.includes("scotto facilmente")) coolScore += 1.5;

    // Capelli & Riflessi
    if(f.hairReflections.includes("Dorati") || f.hairReflections.includes("Rame")) warmScore += 1.5;
    if(f.hairReflections.includes("Cenere")) coolScore += 1.5;

    // Metallo
    if(f.metalPreference.includes("Oro")) warmScore += 2;
    if(f.metalPreference.includes("Argento")) coolScore += 2;

    // Valore / Contrasto
    if(f.overallValue.includes("Scuro") || f.hairNatural.includes("Scuro") || f.eyeColor.includes("Scuro")) deepScore += 2;
    if(f.overallValue.includes("Chiaro") || f.hairNatural.includes("Biondo")) lightScore += 2;

    const isWarm = warmScore > coolScore;
    const isDeep = deepScore >= lightScore;

    if(isWarm) {
      return isDeep ? "autunno" : "primavera";
    } else {
      return isDeep ? "inverno" : "estate";
    }
  };

  const submit = async (e) => {
    if (e) e.preventDefault();
    setBusy(true);
    const assignedSeason = calculateSeason();

    const payload = {
      gender: f.gender,
      city: f.city,
      intake: f,
      season: assignedSeason,
      tier: "free",
      onboarded: true,
      profile: {
        season: assignedSeason,
        gender: f.gender,
        city: f.city,
        notes: `Diagnosi Completa: Sottotono ${assignedSeason.toUpperCase()} calcolato su parametri avanzati.`
      }
    };

    if(rtdb) await update(ref(rtdb, "users/"+user.uid), payload);
    setBusy(false);
    onDone();
  };

  const nextStep = () => {
    if(step < totalSteps) setStep(step + 1);
    else submit();
  };

  const prevStep = () => {
    if(step > 1) setStep(step - 1);
  };

  return html`
    <div class="min-h-screen flex items-center justify-center p-3 sm:p-6 my-auto">
      <div class="glass glass-strong w-full max-w-xl p-6 sm:p-8 space-y-6 border border-sky-500/40 relative overflow-hidden shadow-2xl">
        
        <!-- Header Wizard -->
        <div class="flex items-center justify-between border-b border-sky-500/20 pb-4">
          <${BrandLogo}/>
          <div class="text-right">
            <span class="text-[10px] font-mono text-sky-400 font-bold uppercase tracking-widest block">Analisi Sartoriale</span>
            <span class="text-xs font-bold text-white font-mono">Step ${step} di ${totalSteps}</span>
          </div>
        </div>

        <!-- Barra Progresso -->
        <div class="w-full h-1.5 bg-slate-900 rounded-full overflow-hidden border border-sky-500/20">
          <div class="h-full bg-gradient-to-r from-sky-500 via-indigo-500 to-blue-600 transition-all duration-300" style=${{width: `${(step/totalSteps)*100}%`}}></div>
        </div>

        <!-- Contenitore Carousel con effetto Slider -->
        <div class="min-h-[380px] flex flex-col justify-between">

                  <div class="grid grid-cols-3 gap-2">
                    ${["Donna", "Uomo", "Unisex"].map(g => html`
                      <button type="button" key=${g} class="btn-ghost text-xs py-3 ${f.gender===g?'on':''}" onClick=${()=>setF({...f, gender:g})}>

function Mannequin3D({gender,skin,hair,top,bottom,topTex,bottomTex}){
  const box=useRef(null), api=useRef({});
  api.current.tex={topTex,bottomTex};
  useEffect(()=>{
    let dead=false, raf=0, ro=null, r=null;
    import('https://esm.sh/three@0.160.0').then(T=>{
      const el=box.current; if(dead||!el) return;
      const W=()=>el.clientWidth||320, H=()=>el.clientHeight||460;
      r=new T.WebGLRenderer({antialias:true,alpha:true});
      r.setPixelRatio(Math.min(devicePixelRatio||1,2)); r.setSize(W(),H());
      r.domElement.style.cssText='display:block;width:100%;height:100%;touch-action:pan-y;cursor:grab';
      el.appendChild(r.domElement);
      const sc=new T.Scene(), cam=new T.PerspectiveCamera(32,W()/H(),.1,50);
      cam.position.set(0,.95,4.8); cam.lookAt(0,.85,0);
      sc.add(new T.HemisphereLight(0xfff3dc,0x1a1815,1.1));
      const d=new T.DirectionalLight(0xffffff,1.6); d.position.set(2,3,3); sc.add(d);
      const rim=new T.DirectionalLight(0xff3b5c,1.6); rim.position.set(-3,2,-2); sc.add(rim);
      const rim2=new T.DirectionalLight(0x38e0a0,1.1); rim2.position.set(3,1,-3); sc.add(rim2);
      const M=(c,rg=.55,m=.05)=>new T.MeshStandardMaterial({color:c,roughness:rg,metalness:m,side:T.DoubleSide});
      const mk={skin:M(skin,.55),hair:M(hair,.35),top:M(top,.6),bottom:M(bottom,.6)}; api.current.mk=mk;
      const g=new T.Group(); sc.add(g);
      const add=(geo,mat,x,y,z,rz,sx,sy,sz)=>{const o=new T.Mesh(geo,mat);o.position.set(x||0,y||0,z||0);o.rotation.z=rz||0;o.scale.set(sx||1,sy||1,sz||1);g.add(o);return o};
      const smooth=(pts)=>{const c=new T.SplineCurve(pts.map(q=>new T.Vector2(q[0],q[1])));return c.getPoints(36).map(p=>new T.Vector2(Math.max(.001,p.x),p.y))};
      const lathe=(pts,mat,z)=>add(new T.LatheGeometry(smooth(pts),56),mat,0,0,0,0,1,1,z||.62);
      const F=gender==='Donna';
      add(new T.SphereGeometry(.17,40,30),mk.skin,0,1.76,0,0,.92,1.1,1);
      add(new T.SphereGeometry(.186,40,30),mk.hair,0,1.79,-.03,0,.96,F?1:.8,1);
      if(F){add(new T.CapsuleGeometry(.14,.46,8,18),mk.hair,0,1.5,-.1,0,1,1,.6);add(new T.SphereGeometry(.08,20,16),mk.hair,0,1.95,-.06)}
      add(new T.CylinderGeometry(.06,.07,.18,24),mk.skin,0,1.6,0);
      // cappello di Natale
      const hat=M(0xd6264a,.7), wh=M(0xffffff,.9);
      const cone=add(new T.ConeGeometry(.17,.34,32),hat,.05,2.03,0,-.25); add(new T.TorusGeometry(.17,.035,12,40),wh,0,1.9,0).rotation.x=Math.PI/2; add(new T.SphereGeometry(.05,16,12),wh,.14,2.2,0);
      lathe(F?[[.001,.98],[.2,.98],[.17,1.1],[.19,1.28],[.24,1.45],[.2,1.56],[.001,1.57]]:[[.001,.98],[.23,.98],[.24,1.2],[.29,1.45],[.22,1.56],[.001,1.57]],mk.top);
      [-1,1].forEach(k=>{
        add(new T.CapsuleGeometry(.055,.62,8,16),mk.skin,k*(F?.31:.36),1.15,0,k*.12);
        add(new T.SphereGeometry(.05,16,12),mk.skin,k*(F?.35:.41),.78,0);
        add(new T.CapsuleGeometry(.07,.22,8,16),mk.top,k*(F?.28:.34),1.4,0,k*.2);
        if(F) add(new T.CapsuleGeometry(.07,.58,8,16),mk.skin,k*.09,.32,0);
        else add(new T.CapsuleGeometry(.092,.86,8,16),mk.bottom,k*.11,.5,0);
        add(new T.CapsuleGeometry(.05,.14,6,12),M(0x1a1815,.3),k*.1,-.0,.06).rotation.x=Math.PI/2;
      });
      if(F) lathe([[.36,.58],[.3,.7],[.2,.98],[.001,.98]],mk.bottom,.8);
      add(new T.CylinderGeometry(.5,.54,.05,56),M(0x7a0f2a,.3,.3),0,-.05,0);
      add(new T.TorusGeometry(.5,.01,8,72),M(0xf5c451,.25,.8),0,-.02,0).rotation.x=Math.PI/2;
      // "infisso": capo scansionato applicato come decal fronte/retro
      const dec=(w,h,y,z)=>{const m=new T.MeshBasicMaterial({transparent:true,alphaTest:.05,depthWrite:false});const a=new T.Mesh(new T.PlaneGeometry(w,h),m);a.position.set(0,y,z);a.visible=false;g.add(a);const b=new T.Mesh(a.geometry,m);b.position.set(0,y,-z);b.rotation.y=Math.PI;b.visible=false;g.add(b);return{a,b,m}};
      const dt=dec(.7,.66,1.27,F?.17:.2), db=dec(.52,.95,.5,.13);
      api.current.apply=()=>{const t=api.current.tex||{};[[dt,t.topTex],[db,t.bottomTex]].forEach(([o,src])=>{if(!src){o.a.visible=o.b.visible=false;return}new T.TextureLoader().load(src,x=>{x.colorSpace=T.SRGBColorSpace;o.m.map=x;o.m.needsUpdate=true;o.a.visible=o.b.visible=true})})};

      let ry=.5,vy=0,drag=false,lx=0,t0=0;
      const dn=e=>{drag=true;lx=e.clientX;vy=0;r.domElement.style.cursor='grabbing'};
      const mv=e=>{if(!drag)return;vy=(e.clientX-lx)*.012;ry+=vy;lx=e.clientX};
      const up=()=>{drag=false;r.domElement.style.cursor='grab'};
      r.domElement.addEventListener('pointerdown',dn);addEventListener('pointermove',mv);addEventListener('pointerup',up);
      ro=new ResizeObserver(()=>{r.setSize(W(),H());cam.aspect=W()/H();cam.updateProjectionMatrix()});ro.observe(el);

    }).catch(e=>console.warn('3D non disponibile',e));
    return()=>{dead=true;cancelAnimationFrame(raf);if(ro)ro.disconnect();if(api.current.off)api.current.off();if(r){r.dispose();if(r.domElement.parentNode)r.domElement.parentNode.removeChild(r.domElement)}api.current.mk=null;api.current.apply=null};
  },[gender]);
  useEffect(()=>{const k=api.current.mk;if(!k)return;k.skin.color.set(skin);k.hair.color.set(hair);k.top.color.set(top);k.bottom.color.set(bottom)},[skin,hair,top,bottom,gender]);
  useEffect(()=>{if(api.current.apply)api.current.apply()},[topTex,bottomTex]);
  return html`<div ref=${box} style="width:100%;height:min(62vh,480px);min-height:340px;border-radius:24px;background:radial-gradient(circle at 50% 35%,#4a1426,#0a0610 72%)"></div>`;
}

function WardrobeModule(){
  const {canAccess, user, wardrobeItems, profileData, userGender} = useApp();
  const [step, setStep] = useState(1);
  const [qType, setQType] = useState("Giacca/Cappotto");
  const [qOccasion, setQOccasion] = useState("Serata Formale");
  const [qFabric, setQFabric] = useState("Velluto / Cashmere");
  const [qFit, setQFit] = useState("Sartoriale Slim");
  const [qColor, setQColor] = useState("#2563eb");
  const [qCity, setQCity] = useState(profileData?.city || "Brescia");
  const [busy, setBusy] = useState(false);
  const scanRef=useRef(null);
  const [scanMsg,setScanMsg]=useState("");
  const scanGarment=async(file)=>{
    const img=await new Promise((ok,ko)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=ko;i.src=URL.createObjectURL(file)});
    const k=Math.min(1,320/Math.max(img.width,img.height)),w=Math.max(8,Math.round(img.width*k)),h=Math.max(8,Math.round(img.height*k));
    const c=document.createElement("canvas");c.width=w;c.height=h;const x=c.getContext("2d",{willReadFrequently:true});x.drawImage(img,0,0,w,h);URL.revokeObjectURL(img.src);
    const im=x.getImageData(0,0,w,h),p=im.data;let br=0,bg=0,bb=0,n=0;
    const sample=(i,j)=>{const o=(j*w+i)*4;br+=p[o];bg+=p[o+1];bb+=p[o+2];n++};
    for(let i=0;i<w;i++){sample(i,0);sample(i,h-1)}for(let j=0;j<h;j++){sample(0,j);sample(w-1,j)}
    br/=n;bg/=n;bb/=n;const tol=60;
    const near=o=>Math.abs(p[o]-br)+Math.abs(p[o+1]-bg)+Math.abs(p[o+2]-bb)<tol*1.6;
    const seen=new Uint8Array(w*h),st=[];
    const push=(i,j)=>{if(i<0||j<0||i>=w||j>=h)return;const q=j*w+i;if(seen[q])return;if(!near(q*4))return;seen[q]=1;st.push(q)};
    for(let i=0;i<w;i++){push(i,0);push(i,h-1)}for(let j=0;j<h;j++){push(0,j);push(w-1,j)}
    while(st.length){const q=st.pop(),i=q%w,j=(q/w)|0;push(i+1,j);push(i-1,j);push(i,j+1);push(i,j-1)}
    const bins={};let minX=w,maxX=0,minY=h,maxY=0,cnt=0;
    for(let q=0;q<w*h;q++){const o=q*4;if(seen[q]){p[o+3]=0;continue}cnt++;const i=q%w,j=(q/w)|0;if(i<minX)minX=i;if(i>maxX)maxX=i;if(j<minY)minY=j;if(j>maxY)maxY=j;const key=(p[o]>>5)+","+(p[o+1]>>5)+","+(p[o+2]>>5);const b=bins[key]||(bins[key]=[0,0,0,0]);b[0]++;b[1]+=p[o];b[2]+=p[o+1];b[3]+=p[o+2]}
    if(cnt<w*h*.04) throw new Error("Capo non rilevato: usa uno sfondo uniforme");
    x.putImageData(im,0,0);
    const best=Object.values(bins).sort((a,b)=>b[0]-a[0])[0];
    const hex="#"+[1,2,3].map(i=>Math.round(best[i]/best[0]).toString(16).padStart(2,"0")).join("");
    const cw=maxX-minX+1,ch=maxY-minY+1,o2=document.createElement("canvas");o2.width=cw;o2.height=ch;o2.getContext("2d").drawImage(c,minX,minY,cw,ch,0,0,cw,ch);
    return {url:o2.toDataURL("image/png"),hex,tall:ch/cw};
  };
  const onScan=async(e)=>{
    const f=e.target.files&&e.target.files[0];e.target.value="";if(!f||!rtdb||!user)return;
    setBusy(true);setScanMsg("Scansione in corso…");
    try{
      const s=await scanGarment(f);
      const type=/Pantaloni|Gonna/.test(qType)||s.tall>1.5&&qType==="Abito da Sera"?qType:qType;
      await push(ref(rtdb,"wardrobe/"+user.uid),{name:type+" scansionato",type,colorHex:s.hex,scanUrl:s.url,scanned:true,city:qCity,desc:"Capo acquisito dalla fotocamera: sfondo rimosso e colore dominante "+s.hex.toUpperCase()+".",createdAt:serverTimestamp()});
      setScanMsg("Capo aggiunto! Premi «Indossa» per vederlo sul manichino.");
    }catch(err){setScanMsg(err.message||"Scansione non riuscita")}
    setBusy(false);
  };
  const wearOn=(item)=>{try{sessionStorage.setItem("lf_wear",JSON.stringify({type:item.type,colorHex:item.colorHex,scanUrl:item.scanUrl||null}))}catch(e){}dispatchEvent(new CustomEvent("lf-tab",{detail:"mannequin"}))};

  if(!canAccess("wardrobe")) return html`<${LockedFeatureCard} title="ArmoWardrobe Digital" module="wardrobe" />`;

  const generateOutfitAI = async () => {
    if(!rtdb || !user) return;
    setBusy(true);
    try {
      const prompt = `Genera un capo d'abbigliamento digitale dettagliato per un utente ${userGender} a ${qCity}.
      Parametri: Tipo: ${qType}, Occasione: ${qOccasion}, Tessuto: ${qFabric}, Vestibilità: ${qFit}, Colore Hex: ${qColor}.
      Restituisci un JSON con campi: "name" (stringa elegante), "desc" (descrizione sartoriale di 2 frasi adattata al meteo).`;
      
      const res = await groq({
        messages: [{role:"system", content:"Rispondi solo in JSON valido."}, {role:"user", content: prompt}],
        json: true
      });
      const parsed = JSON.parse(res);

      await push(ref(rtdb, "wardrobe/"+user.uid), {
        name: parsed.name || `${qType} ${qOccasion}`,
        type: qType,
        occasion: qOccasion,
        fabric: qFabric,
        fit: qFit,
        colorHex: qColor,
        city: qCity,
        desc: parsed.desc || `Capo sartoriale per ${qCity} in ${qFabric}.`,
        season: profileData?.season || "inverno",
        createdAt: serverTimestamp()
      });
      setStep(1);
    } catch(e) {
      await push(ref(rtdb, "wardrobe/"+user.uid), {
        name: `${qType} - ${qOccasion}`,
        type: qType,
        colorHex: qColor,
        city: qCity,
        desc: `Capo generato per ${qCity} con finitura in ${qFabric}.`,
        createdAt: serverTimestamp()

      setStep(1);
    } finally { setBusy(false); }
  };

  return html`
    <div class="space-y-6 max-w-4xl mx-auto">

        <div>
          <h2 class="text-xl font-serif font-bold text-white flex items-center gap-2">
            <${SvgIcon} name="wardrobe" className="w-6 h-6 text-sky-400" /> ArmoWardrobe Digital Generativo
          </h2>
          <p class="text-xs text-sky-200 mt-1">${scanMsg} Generazione capo guidata da IA con dati meteo approssimativi di <b>${qCity}</b>.</p>
        </div>
        <div class="flex gap-2 flex-wrap"><input ref=${scanRef} type="file" accept="image/*" capture="environment" style="display:none" onChange=${onScan}/><button type="button" class="btn text-xs" disabled=${busy} onClick=${()=>scanRef.current&&scanRef.current.click()}>📷 Scansiona capo</button><button type="button" class="btn-ghost text-xs" onClick=${()=>setStep(2)}>+ Genera Capo Digital</button></div>
      </div>

      ${step === 2 && html`
        <div class="glass p-6 space-y-4 border border-sky-500/40">
          <h3 class="font-serif font-bold text-white text-base">Questionario Guidato Generazione Capo</h3>
          
          <div class="grid sm:grid-cols-2 gap-4 text-xs">
            <label class="block"><span class="text-slate-300">1. Tipo di Capo</span>
              <select class="field mt-1" value=${qType} onChange=${e=>setQType(e.target.value)}>
                <option value="Giacca/Cappotto">Giacca / Cappotto</option>
                <option value="Maglioncino/Cardigan">Maglioncino / Cardigan</option>
                <option value="Abito da Sera">Abito da Sera</option>
                <option value="Pantaloni/Gonna">Pantaloni / Gonna</option>
              </select>
            </label>

            <label class="block"><span class="text-slate-300">2. Occasione d'Uso</span>
              <select class="field mt-1" value=${qOccasion} onChange=${e=>setQOccasion(e.target.value)}>
                <option value="Serata Formale">Serata Formale</option>
                <option value="Business / Ufficio">Business / Ufficio</option>
                <option value="Casual Chic">Casual Chic</option>
              </select>
            </label>

            <label class="block"><span class="text-slate-300">3. Tessuto Sartoriale</span>
              <select class="field mt-1" value=${qFabric} onChange=${e=>setQFabric(e.target.value)}>
                <option value="Velluto / Cashmere">Velluto / Cashmere</option>
                <option value="Seta / Satèn">Seta / Satèn</option>
                <option value="Lana Vergine">Lana Vergine</option>

            </label>

            <label class="block"><span class="text-slate-300">4. Vestibilità</span>
              <select class="field mt-1" value=${qFit} onChange=${e=>setQFit(e.target.value)}>
                <option value="Sartoriale Slim">Sartoriale Slim</option>

            <label class="block"><span class="text-slate-300">5. Posizione Approssimativa (Città)</span>
              <input class="field mt-1" value=${qCity} onInput=${e=>setQCity(e.target.value)}/>

              <input type="color" class="h-11 w-full rounded-2xl cursor-pointer bg-transparent mt-1" value=${qColor} onChange=${e=>setQColor(e.target.value)}/>

            <button type="button" class="btn flex-1" disabled=${busy} onClick=${generateOutfitAI}>Elabora & Salva Capo Digital</button>
            <button type="button" class="btn-ghost" onClick=${()=>setStep(1)}>Annulla</button>
          </div>

      `}

      <div class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3">
        ${wardrobeItems.map(item => html`

function ExpertChatModule(){
  const {user, userTier, canAccess} = useApp();
  const [messages, setMessages] = useState([]);
  const [input, setInput] = useState("");
  const [lastStaffReplyTime, setLastStaffReplyTime] = useState(null);
  const [timeLeft, setTimeLeft] = useState(0);

  if(!canAccess("expert_chat")) return html`<${LockedFeatureCard} title="Consulenza Stylist" module="expert_chat" />`;

  useEffect(() => {
    if(!rtdb || !user) return;
    const chatRef = ref(rtdb, `expert_chats/${user.uid}/messages`);
    const unsub = onValue(chatRef, snap => {
      const v = snap.val();
      if(v) {
        const list = Object.keys(v).map(k => ({id:k, ...v[k]}));
        setMessages(list);
        const lastStaffMsg = [...list].reverse().find(m => m.sender === "staff");
        if(lastStaffMsg) setLastStaffReplyTime(lastStaffMsg.timestamp);
      }
    });
    return () => unsub();
  }, [user]);

  useEffect(() => {
    if(userTier !== "free" || !lastStaffReplyTime) return;
    const interval = setInterval(() => {
      const elapsed = (Date.now() - lastStaffReplyTime) / 1000;
      const remaining = Math.max(0, 300 - Math.floor(elapsed));
      setTimeLeft(remaining);
    }, 1000);
    return () => clearInterval(interval);
  }, [lastStaffReplyTime, userTier]);

  const send = async (e) => {
    e.preventDefault();
    if(!input.trim() || !rtdb || !user) return;
    if(userTier === "free" && lastStaffReplyTime && timeLeft <= 0) {
      alert("Il tempo di consulenza gratuita di 5 minuti è terminato. Fai upgrade a Pro per chat illimitata.");
      return;
    }

    const msgObj = {
      text: input,
      sender: "user",
      senderEmail: user.email,
      timestamp: serverTimestamp()
    };
    await push(ref(rtdb, `expert_chats/${user.uid}/messages`), msgObj);
    await update(ref(rtdb, `expert_chats/${user.uid}`), {
      lastMessage: input,
      lastUpdate: serverTimestamp(),
      userEmail: user.email
    });
    setInput("");
  };

  const formatTimer = (s) => {
    const m = Math.floor(s / 60);
    const sec = s % 60;
    return `${m}:${sec < 10 ? '0' : ''}${sec}`;
  };

  return html`
    <div class="glass max-w-3xl mx-auto flex flex-col h-[75vh] p-5 space-y-4 border border-sky-500/30">
      <div class="flex items-center justify-between pb-3 border-b border-sky-500/20">
        <div class="flex items-center gap-3">
          <${SvgIcon} name="chat" className="w-6 h-6 text-sky-400" />
          <div>
            <h2 class="font-serif font-bold text-white">Consulenza Diretta con lo Stylist</h2>
            <span class="text-[10px] text-slate-400">Supporto Armocromatico Sartoriale In Tempo Reale</span>
          </div>
        </div>

        ${userTier === "free" && html`
          <div class="px-3 py-1 rounded-xl bg-blue-950/80 border border-sky-500/40 text-sky-300 text-xs font-mono font-bold">
            ⏱ Timer Freemium: ${timeLeft > 0 ? formatTimer(timeLeft) : "Scaduto (Upgrade Pro)"}
          </div>
        `}
      </div>

      <div class="flex-1 overflow-y-auto space-y-3 pr-2 text-xs custom-scrollbar">
        ${messages.length === 0 ? html`
          <div class="text-center text-slate-400 py-12">Nessun messaggio inviato. Scrivi un messaggio allo Stylist Horizon per iniziare.</div>
        ` : messages.map(m => html`
          <div key=${m.id} class="p-3 rounded-2xl max-w-[80%] ${m.sender==='user'?'ml-auto on text-white':'bg-slate-900 border border-sky-500/20 text-slate-200'}">
            <span class="text-[9px] text-sky-300 font-bold block mb-1">${m.sender==='user'?'Tu':'Stylist Landra'}</span>
            <p>${m.text}</p>
          </div>
        `)}
      </div>

      <form class="flex gap-2" onSubmit=${send}>
        <input class="field" placeholder="Scrivi al tuo Stylist..." value=${input} onInput=${e=>setInput(e.target.value)}/>
        <button type="submit" class="btn" disabled=${userTier === "free" && lastStaffReplyTime && timeLeft <= 0}>Invia</button>
      </form>
    </div>
  `;
}

function Garland(){
  const cols=["#fff3c4","#8ec5ff","#ffffff","#5fa8ff"],bulbs=[];
  for(let i=0;i<8;i++)for(const t of [.2,.5,.8]){const y=4*(1-t)*(1-t)+104*t*(1-t)+4*t*t;bulbs.push({l:(i*100+100*t)/8,y:y,c:cols[bulbs.length%4],d:(bulbs.length%5)*.35})}
  const sw=Array.from({length:8},(_,i)=>`M${i*100},4 Q${i*100+50},52 ${i*100+100},4`).join(" ");
  return html`<div class="lf-garland" aria-hidden="true"><svg viewBox="0 0 800 62" preserveAspectRatio="none"><path d=${sw} fill="none" stroke="#14506A" stroke-width="9" stroke-linecap="round" vector-effect="non-scaling-stroke"/><path d=${sw} fill="none" stroke="#E6F3FF" stroke-width="9" stroke-dasharray="1 5" opacity=".75" vector-effect="non-scaling-stroke"/><path d=${sw} fill="none" stroke="#3E8CA8" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>${bulbs.map((b,k)=>html`<i key=${k} style=${{left:b.l+"%",top:(b.y+5)+"px","--c":b.c,animationDelay:b.d+"s"}}></i>`)}</div>`;
}

function Sheet({onClose,children}){
  useEffect(()=>{const k=e=>e.key==='Escape'&&onClose();addEventListener('keydown',k);return()=>removeEventListener('keydown',k)},[]);

}
function FloatStaff(){
  const def=()=>({x:innerWidth-76,y:innerHeight-200});
  const [pos,setPos]=useState(()=>{try{return JSON.parse(localStorage.getItem('lf_staff_pos'))||def()}catch(e){return def()}});
  const d=useRef(null);
  const cl=(x,y)=>({x:Math.max(8,Math.min(innerWidth-66,x)),y:Math.max(8,Math.min(innerHeight-66,y))});
  const down=e=>{d.current={sx:e.clientX,sy:e.clientY,ox:pos.x,oy:pos.y,m:false};try{e.currentTarget.setPointerCapture(e.pointerId)}catch(_){}};
  const move=e=>{const s=d.current;if(!s)return;const dx=e.clientX-s.sx,dy=e.clientY-s.sy;if(Math.abs(dx)+Math.abs(dy)>6)s.m=true;if(s.m)setPos(cl(s.ox+dx,s.oy+dy))};
  const up=()=>{const s=d.current;d.current=null;if(!s)return;if(s.m){try{localStorage.setItem('lf_staff_pos',JSON.stringify(pos))}catch(_){}}else location.hash='#staff'};
  return html`<button type="button" class="lf-staff" aria-label="Apri CMS staff" style=${{left:pos.x+'px',top:pos.y+'px'}} onPointerDown=${down} onPointerMove=${move} onPointerUp=${up} onPointerCancel=${()=>{d.current=null}}>★<small>STAFF</small></button>`;
}

        <button type="button" class="lf-w" style="--a:#8fc0ff;--b:#2a5fa8" onClick=${()=>setCheckoutTier(userTier==="free"?"pro":userTier)}><small>✦ Piano</small><b style="text-transform:capitalize">${userTier}</b><small>${userTier==="free"?"passa a Pro":"attivo"}</small></button>
      </div>
      <section class="lf-pal" style=${{"--k":cc}}>
        <div class="lf-sw">${pal.map((c,i)=>html`<button type="button" key=${c} aria-label=${c} style=${{background:c,"--r":(i-2)*6+"deg"}} onClick=${()=>{setCol(c);try{navigator.clipboard&&navigator.clipboard.writeText(c)}catch(e){}}}></button>`)}</div>
        <div class="lf-pal-t"><span class="lf-chip"><${Star} size=${14}/> Analisi Personalizzata</span><div class="font-serif">La tua Palette Armonia</div><small>Tocca un colore: ${cc.toUpperCase()}</small></div>
        <button type="button" class="btn lf-vis" onClick=${()=>setSheet("palette")}>Visualizza <span class="lf-arr"><${LI} n="arrow"/></span></button>
      </section>
      <div class="lf-two">
        <button type="button" class="lf-big" style=${bg(img(arts[0])||img((videos||[])[0]))} onClick=${()=>go("video")}><${LI} n="flame"/><b>Tendenze<br/>Moda 2026</b><small>Masterclass e novità di stagione</small><span class="lf-pill">Esplora <${LI} n="arrow"/></span></button>
        <button type="button" class="lf-big" style=${bg(img((socialPosts||[])[0])||img(arts[1]))} onClick=${()=>go("social")}><${LI} n="gem"/><b>Lookbook<br/>Esclusivo</b><small>I look più iconici</small><span class="lf-pill">Sfoglia <${LI} n="arrow"/></span></button>
      </div>
      ${arts.length>0&&html`<div class="lf-h2"><span><${Star} size=${22}/> Ispirazioni per te</span><button type="button" class="lf-link" onClick=${()=>go("social")}>Vedi tutto <${LI} n="arrow"/></button></div>
      <div class="lf-row">${arts.map(a=>html`<button type="button" key=${a.id} class="lf-insp" style=${bg(img(a))} onClick=${()=>setPick(a)}><span>${a.title?.it||a.title}</span></button>`)}</div>`}
      <div class="lf-h2"><span>Home Editorial</span></div>
      <${FeedModule} onSwitchTab=${go}/>`}
      ${tab==="social"&&html`<${SocialPageModule}/>`}
      ${tab==="mannequin"&&html`<${MannequinStudioModule}/>`}
      ${tab==="wardrobe"&&html`<${WardrobeModule}/>`}
      ${tab==="orion"&&html`<${OrionChatModule}/>`}
      ${tab==="video"&&html`<${VideoMasterclassModule}/>`}
      ${tab==="expert_chat"&&html`<${ExpertChatModule}/>`}
      ${tab==="videocall"&&html`<${VideocallBookingModule}/>`}
      ${tab==="info"&&html`<${InfoModule}/>`}
      ${tab==="profile"&&html`<${ProfileModule}/>`}
    </main>
    <nav class="lf-tab" aria-label="Navigazione">
      <button type="button" class=${tab==="feed"?"cur":""} onClick=${()=>go("feed")}><${SvgIcon} name="home" className="w-6 h-6"/><span>Home</span></button>
      <button type="button" class=${tab==="social"?"cur":""} onClick=${()=>go("social")}><${SvgIcon} name="social" className="w-6 h-6"/><span>Social</span></button>
      <button type="button" class="lf-mid" aria-label="Moduli" onClick=${()=>setSheet("mods")}><${Star} size=${36}/></button>
      <button type="button" class=${tab==="mannequin"?"cur":""} onClick=${()=>go("mannequin")}><${SvgIcon} name="mannequin" className="w-6 h-6"/><span>Manichino</span></button>
      <button type="button" class=${tab==="profile"?"cur":""} onClick=${()=>go("profile")}><${SvgIcon} name="profile" className="w-6 h-6"/><span>Profilo</span></button>
    </nav>
    ${isStaff&&html`<${FloatStaff}/>`}
    ${sheet==="mods"&&html`<${Sheet} onClose=${()=>setSheet(null)}><h3 class="font-serif text-xl mb-3">Tutti i moduli</h3><div class="grid grid-cols-3 gap-3">${SYSTEM_MODULES.map(m=>html`<button type="button" key=${m.id} class="lf-qi" onClick=${()=>go(m.id)}><i style=${{"--c":MOD_COL[m.id]}}><${SvgIcon} name=${mi(m.id)} className="w-6 h-6"/></i><span>${m.name}</span></button>`)}</div><button type="button" class="btn-ghost w-full mt-3" onClick=${()=>signOut(auth)}>Esci dall’account</button><//>`}
    ${sheet==="search"&&html`<${Sheet} onClose=${()=>setSheet(null)}><input autofocus class="field" placeholder="Cerca moduli e articoli…" value=${q} onInput=${e=>setQ(e.target.value)}/><div class="space-y-2 mt-3">${sm.map(m=>html`<button type="button" key=${m.id} class="btn-ghost w-full justify-start" onClick=${()=>go(m.id)}>${m.name}</button>`)}${sa.map(a=>html`<button type="button" key=${a.id} class="btn-ghost w-full justify-start" onClick=${()=>{setSheet(null);setPick(a)}}>📰 ${a.title?.it||a.title}</button>`)}</div><//>`}
    ${sheet==="bell"&&html`<${Sheet} onClose=${()=>setSheet(null)}><h3 class="font-serif text-xl mb-3">Notifiche</h3>${nots.length?nots.map(a=>html`<button type="button" key=${a.id} class="btn-ghost w-full justify-start mb-2" onClick=${()=>{setSheet(null);setPick(a)}}>🎁 ${a.title?.it||a.title}</button>`):html`<p>Nessuna novità.</p>`}<//>`}
    ${sheet==="season"&&html`<${Sheet} onClose=${()=>setSheet(null)}><h3 class="font-serif text-xl">${wx[0]} · ${wx[1]}</h3><p class="mt-2">Stagione cromatica: <b>${season}</b>. Consulta Orion per outfit adatti al meteo.</p><button type="button" class="btn mt-3" onClick=${()=>go("orion")}>Chiedi a Orion</button><//>`}
    ${sheet==="palette"&&html`<${Sheet} onClose=${()=>setSheet(null)}><h3 class="font-serif text-2xl mb-3">La tua Palette Armonia</h3><div class="grid grid-cols-5 gap-2">${pal.map(c=>html`<div key=${c} style=${{background:c,height:"90px",borderRadius:"16px",border:"1px solid rgba(255,255,255,.4)"}}></div>`)}</div><p class="mt-3 text-sm">${pal.join(" · ").toUpperCase()}</p><button type="button" class="btn mt-3" onClick=${()=>go("orion")}>Affina con Orion AI</button><//>`}
    ${pick&&html`<${Sheet} onClose=${()=>setPick(null)}>${img(pick)&&html`<img src=${img(pick)} alt="" style="width:100%;height:220px;object-fit:cover;border-radius:20px;margin-bottom:12px"/>`}<h3 class="font-serif text-2xl">${pick.title?.it||pick.title}</h3><div class="whitespace-pre-line text-sm mt-2">${pick.body?.it||pick.body||pick.excerpt?.it||""}</div><//>`}
    <${PayPalCheckoutModal}/>
  </div><//>`;
}

function Main(){
  const {profileData, profileLoaded, loadFailed} = useApp();
  if(!profileLoaded) return html`<${LoadingScreen}/>`;
  if(loadFailed && !profileData) return html`<${LoadingScreen} failed=${true}/>`;
  if(!profileData?.onboarded) return html`<${Skin}><${IntakeSurvey} onDone=${()=>window.location.reload()}/><//>`;
  return html`<${Shell}/>`;
}

function App(){
  return html`
    <${Providers}>
      <${Skin} top=${true}>
        <${AuthGate}>
          <${Main}/>
        <//>
      <//>
    <//>
  `;
}

render(html`<${App}/>`, document.getElementById("app"));
</script>
</body>
</html>
