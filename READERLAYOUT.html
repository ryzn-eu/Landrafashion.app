(() => {
  const c = document.getElementById("fx");
  if(!c) return;
  const x = c.getContext("2d");
  let W, H;
  const rs = () => { W = c.width = innerWidth; H = c.height = innerHeight; };
  rs();
  addEventListener("resize", rs);
  const P = Array.from({length: 45}, () => ({x: Math.random()*2400, y: Math.random()*1400, r: Math.random()*1.8+0.8, s: Math.random()*0.5+0.1, t: Math.random()*6}));
  (function f(){
    x.clearRect(0,0,W,H);
    for(const p of P){
      p.y += p.s; p.t += 0.01; p.x += Math.sin(p.t)*0.2;
      if(p.y > H+5){ p.y = -5; p.x = Math.random()*W; }
      x.globalAlpha = 0.4; x.fillStyle = "#fef3c7";
      x.beginPath(); x.arc(p.x%W, p.y, p.r, 0, 7); x.fill();
    }
    requestAnimationFrame(f);
  })();
})();

const pj = s => {
  try {
    return JSON.parse(s.replace(/```json/g, "").replace(/```/g, "").trim());
  } catch {
    const m = s.match(/\{[\s\S]*\}/);
    if(!m) throw Error("JSON non valido dall'AI");
    return JSON.parse(m[0]);
  }
};

async function groq({messages, json, maxTokens=3000, temperature=.6}){
  const body = {model: CFG.TEXT, messages, temperature, max_tokens: maxTokens};
  if(json) body.response_format = {type: "json_object"};
  const r = await fetch("https://api.groq.com/openai/v1/chat/completions", {
    method: "POST",
    headers: {"Authorization": "Bearer "+CFG.GROQ_KEY, "Content-Type": "application/json"},
    body: JSON.stringify(body)
  });
  if(!r.ok) throw Error("Errore chiamata Groq AI");
  const j = await r.json();
  return (j.choices[0].message.content||"").trim();
}

async function uploadToCloudinary(file) {
  try {
    const fd = new FormData();
    fd.append("file", file);
    fd.append("upload_preset", CFG.CLOUD_PRESET);
    const r = await fetch(`https://api.cloudinary.com/v1_1/${CFG.CLOUD_NAME}/image/upload`, { method: "POST", body: fd });
    if(r.ok) {
      const data = await r.json();
      return data.secure_url;
    }
  } catch(e) { console.warn("Cloudinary upload fallback:", e); }
  return new Promise((resolve) => {
    const reader = new FileReader();
    reader.onloadend = () => resolve(reader.result);
    reader.readAsDataURL(file);
  });
}

function AuthGate({children}){
  const {user, authReady} = useApp();
  const [isReg, setIsReg] = useState(false);
  const [email, setEmail] = useState("");
  const [pass, setPass] = useState("");
  const [acceptGdpr, setAcceptGdpr] = useState(false);
  const [err, setErr] = useState("");
  const [busy, setBusy] = useState(false);

  if(!authReady) return html`<div class="grid min-h-screen place-items-center text-amber-200">Caricamento piattaforma...</div>`;
  if(user) return children;

  const submit = async e => {
    e.preventDefault();
    if(isReg && !acceptGdpr) { setErr("È necessario accettare le condizioni GDPR."); return; }
    setErr(""); setBusy(true);
    try {
      if(isReg) {
        const c = await createUserWithEmailAndPassword(auth, email, pass);
        if(rtdb) await set(ref(rtdb, "users/"+c.user.uid), {email, acceptGdpr, tier: "free", onboarded: false, createdAt: serverTimestamp()});
      } else {
        await signInWithEmailAndPassword(auth, email, pass);
      }
    } catch(x) { setErr(x.message.replace("Firebase: ", "")); }
    finally { setBusy(false); }
  };

  return html`
    <div class="grid min-h-screen place-items-center p-4">
      <form onSubmit=${submit} class="glass glass-strong w-full max-w-md space-y-4 p-8 border border-amber-600/30">
        <div class="flex items-center justify-center mb-2"><${BrandLogo}/></div>
        <h1 class="text-xl font-serif font-bold text-white text-center">Accedi a LandraFashion</h1>
        <p class="text-xs text-stone-300 text-center">Armocromia & Intelligenza Artificiale Orion</p>
        
        <input class="field" type="email" required placeholder="Email" value=${email} onInput=${e=>setEmail(e.target.value)}/>
        <input class="field" type="password" required minlength="6" placeholder="Password" value=${pass} onInput=${e=>setPass(e.target.value)}/>
        
        ${isReg && html`
          <label class="flex items-start gap-2 cursor-pointer text-xs text-stone-300 pt-2 border-t border-amber-600/20">
            <input type="checkbox" required checked=${acceptGdpr} onChange=${e=>setAcceptGdpr(e.target.checked)} class="mt-0.5 accent-red-600"/>
            <span>Accetto il trattamento dati GDPR Horizon (server Alfianello BS / San Gervasio BS).</span>
          </label>
        `}

        ${err && html`<p class="text-xs text-red-400 text-center">${err}</p>`}
        <button class="btn w-full" disabled=${busy}>${isReg?"Registrati":"Accedi"}</button>
        <button type="button" class="w-full text-xs text-amber-400 bg-transparent border-0 cursor-pointer text-center" onClick=${()=>setIsReg(!isReg)}>
          ${isReg?"Hai già un account? Accedi":"Non hai un account? Registrati"}
        </button>
      </form>
    </div>
  `;
}

function OrionChatModule(){
  const {canAccess, profileData, userGender} = useApp();
  const [msgs, setMsgs] = useState([{role:"assistant", content:"Salve, sono Orion AI. Come posso aiutarti con il tuo stile?"}]);
  const [input, setInput] = useState("");
  const [busy, setBusy] = useState(false);

  if(!canAccess("orion")) return html`<${LockedFeatureCard} title="Orion AI Concierge" module="orion" />`;

  const send = async () => {
    if(!input.trim() || busy) return;
    const m = [...msgs, {role:"user", content:input}]; setMsgs(m); setInput(""); setBusy(true);
    try {
      const reply = await groq({messages:[{role:"system", content:`Sei Orion AI per ${userGender} (${profileData?.season}).`}, ...m]});
      setMsgs([...m, {role:"assistant", content:reply}]);
    } catch(e) { setMsgs([...m, {role:"assistant", content:"Errore temporaneo."}]); }
    setBusy(false);
  };

  return html`
    <div class="glass max-w-3xl mx-auto flex flex-col h-[75vh] p-4 space-y-4">
      <div class="flex items-center gap-3 pb-3 border-b border-amber-600/20">
        <${SvgIcon} name="orion" className="w-6 h-6 text-amber-400" />
        <h2 class="font-serif font-bold text-white">Orion AI Concierge</h2>
      </div>
      <div class="flex-1 overflow-y-auto space-y-3 pr-2 text-xs">
        ${msgs.map(x => html`<div class="p-3 rounded-2xl max-w-[85%] ${x.role==='user'?'ml-auto on text-white':'bg-stone-900 border border-amber-600/20 text-stone-200'}">${x.content}</div>`)}
      </div>
      <form class="flex gap-2" onSubmit=${e=>{e.preventDefault(); send();}}>
        <input class="field" placeholder="Chiedi ad Orion..." value=${input} onInput=${e=>setInput(e.target.value)}/>
        <button class="btn" disabled=${busy}>Invia</button>
      </form>
    </div>
  `;
}

        <nav class="space-y-1 text-xs font-semibold">
          <button class="w-full text-left p-2.5 rounded-lg transition ${tab==='overview'?'bg-amber-600 text-white':'text-slate-300 hover:bg-slate-800'}" onClick=${()=>setTab('overview')}>📊 Dashboard Generale</button>
          <button class="w-full text-left p-2.5 rounded-lg transition ${tab==='articles'?'bg-amber-600 text-white':'text-slate-300 hover:bg-slate-800'}" onClick=${()=>setTab('articles')}>📰 Gestione Articoli Feed</button>
          <button class="w-full text-left p-2.5 rounded-lg transition ${tab==='products'?'bg-amber-600 text-white':'text-slate-300 hover:bg-slate-800'}" onClick=${()=>setTab('products')}>🛍️ Shop Mirato</button>
          <button class="w-full text-left p-2.5 rounded-lg transition ${tab==='social'?'bg-amber-600 text-white':'text-slate-300 hover:bg-slate-800'}" onClick=${()=>setTab('social')}>📸 Social Page & Storie</button>
          <button class="w-full text-left p-2.5 rounded-lg transition ${tab==='pricing'?'bg-amber-600 text-white':'text-slate-300 hover:bg-slate-800'}" onClick=${()=>setTab('pricing')}>💳 Listino Prezzi & Abbonamenti</button>
        </nav>

        <a href="#" class="btn-ghost text-xs w-full text-center block mt-8">← Torna all'App Utente</a>
      </aside>

      <!-- MAIN CONTENT ADMIN -->
      <main class="flex-1 p-8 space-y-6 overflow-y-auto bg-slate-900/50">
        ${tab==='overview' && html`
          <div class="space-y-6">
            <h2 class="text-2xl font-bold text-white">Dashboard CMS Amministrativa</h2>
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
              <div class="bg-slate-900 border border-slate-800 p-5 rounded-xl">
                <span class="text-3xl font-bold text-amber-400">${articles.length}</span>
                <span class="text-xs text-slate-400 block mt-1">Articoli Totali</span>
              </div>
              <div class="bg-slate-900 border border-slate-800 p-5 rounded-xl">
                <span class="text-3xl font-bold text-amber-400">${products.length}</span>
                <span class="text-3xl font-bold text-amber-400"></span>
                <span class="text-xs text-slate-400 block mt-1">Prodotti Shop</span>
              </div>
              <div class="bg-slate-900 border border-slate-800 p-5 rounded-xl">
                <span class="text-3xl font-bold text-amber-400">${socialPosts.length}</span>
                <span class="text-xs text-slate-400 block mt-1">Post Social</span>
              </div>
              <div class="bg-slate-900 border border-slate-800 p-5 rounded-xl">
                <span class="text-3xl font-bold text-amber-400">${(stories||[]).length}</span>
                <span class="text-xs text-slate-400 block mt-1">Storie Attive</span>
              </div>
            </div>
          </div>
        `}

        ${tab==='articles' && html`
          <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl space-y-4 max-w-3xl">
            <h3 class="font-bold text-white text-lg">Crea o Modifica Articolo</h3>
            <input class="field bg-slate-950" placeholder="Titolo articolo" value=${artTitle} onInput=${e=>setArtTitle(e.target.value)}/>
            <input class="field bg-slate-950" placeholder="Estratto breve" value=${artExcerpt} onInput=${e=>setArtExcerpt(e.target.value)}/>
            <div class="grid grid-cols-2 gap-3">
              <select class="field bg-slate-950" value=${artSeason} onChange=${e=>setArtSeason(e.target.value)}>
                ${SEASONS.map(s=>html`<option value=${s}>Stagione: ${s}</option>`)}
              </select>
              <select class="field bg-slate-950" value=${artGender} onChange=${e=>setArtGender(e.target.value)}>
                ${TARGET_GENDERS.map(g=>html`<option value=${g}>Target Sesso: ${g}</option>`)}
              </select>
            </div>
            <input type="file" class="field bg-slate-950 text-xs" accept="image/*" onChange=${e=>setArtFile(e.target.files[0])}/>
            <textarea class="field bg-slate-950" rows="5" placeholder="Contenuto editoriale..." value=${artBody} onInput=${e=>setArtBody(e.target.value)}></textarea>
            <button class="btn" onClick=${saveArticle}>Pubblica nel Feed</button>

            <div class="pt-6 border-t border-slate-800 space-y-2">
              <h4 class="font-bold text-white text-sm">Articoli Esistenti (${articles.length})</h4>
              ${articles.map(a => html`
                <div class="flex justify-between items-center p-3 bg-slate-950 rounded-lg text-xs">
                  <span>${a.title?.it || a.title}</span>
                  <button class="text-red-400" onClick=${()=>remove(ref(rtdb, "articles/"+a.id))}>Elimina</button>
                </div>
              `)}
            </div>
          </div>
        `}

        ${tab==='products' && html`
          <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl space-y-4 max-w-3xl">
            <h3 class="font-bold text-white text-lg">Gestione Shop Mirato</h3>
            <input class="field bg-slate-950" placeholder="Nome prodotto" value=${prodName} onInput=${e=>setProdName(e.target.value)}/>
            <input class="field bg-slate-950" type="number" placeholder="Prezzo (€)" value=${prodPrice} onInput=${e=>setProdPrice(e.target.value)}/>
            <input class="field bg-slate-950" placeholder="Link acquisto" value=${prodLink} onInput=${e=>setProdLink(e.target.value)}/>
            <div class="grid grid-cols-2 gap-3">
              <select class="field bg-slate-950" value=${prodSeason} onChange=${e=>setProdSeason(e.target.value)}>
                ${SEASONS.map(s=>html`<option value=${s}>Stagione: ${s}</option>`)}
              </select>
              <select class="field bg-slate-950" value=${prodGender} onChange=${e=>setProdGender(e.target.value)}>
                ${TARGET_GENDERS.map(g=>html`<option value=${g}>Target: ${g}</option>`)}
              </select>
            </div>
            <input type="file" class="field bg-slate-950 text-xs" accept="image/*" onChange=${e=>setProdFile(e.target.files[0])}/>
            <button class="btn" onClick=${saveProduct}>Aggiungi Prodotto</button>

            <div class="pt-6 border-t border-slate-800 space-y-2">
              <h4 class="font-bold text-white text-sm">Prodotti Esistenti</h4>
              ${products.map(p => html`
                <div class="flex justify-between items-center p-3 bg-slate-950 rounded-lg text-xs">
                  <span>${p.name} (€${p.price})</span>
                  <button class="text-red-400" onClick=${()=>remove(ref(rtdb, "products/"+p.id))}>Elimina</button>
                </div>
              `)}
            </div>
          </div>
        `}

        ${tab==='social' && html`
          <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl space-y-4 max-w-3xl">
            <h3 class="font-bold text-white text-lg">Gestione Social Page & Post</h3>
            <textarea class="field bg-slate-950" rows="3" placeholder="Testo del post social..." value=${socialCaption} onInput=${e=>setSocialCaption(e.target.value)}></textarea>
            <input type="file" class="field bg-slate-950 text-xs" accept="image/*" onChange=${e=>setSocialFile(e.target.files[0])}/>
            <button class="btn" onClick=${saveSocialPost}>Pubblica Post Social</button>

            <div class="pt-6 border-t border-slate-800 space-y-2">
              <h4 class="font-bold text-white text-sm">Post Social Attivi (${socialPosts.length})</h4>
              ${socialPosts.map(p => html`
                <div class="flex justify-between items-center p-3 bg-slate-950 rounded-lg text-xs">
                  <span class="truncate max-w-md">${p.caption}</span>
                  <button class="text-red-400" onClick=${()=>remove(ref(rtdb, "socialPosts/"+p.id))}>Elimina</button>
                </div>
              `)}
            </div>
          </div>
        `}

        ${tab==='pricing' && html`
          <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl space-y-4 max-w-md">
            <h3 class="font-bold text-white text-lg">Gestione Prezzi Abbonamenti</h3>
            <label class="block text-xs text-slate-300">Prezzo Pro (€/mo)
              <input class="field bg-slate-950 mt-1" value=${pPro} onInput=${e=>setPPro(e.target.value)}/>
            </label>
            <label class="block text-xs text-slate-300">Prezzo Plus (€/mo)
              <input class="field bg-slate-950 mt-1" value=${pPlus} onInput=${e=>setPPlus(e.target.value)}/>
            </label>
            <button class="btn" onClick=${savePricing}>Salva Listino</button>
          </div>
        `}
      </main>
    </div>
  `;
}

function Shell(){
  const {isStaff, userTier, pricing, setCheckoutTier} = useApp();
  const [tab, setTab] = useState("feed");
  const [startOpen, setStartOpen] = useState(false);
  const [dropdownOpen, setDropdownOpen] = useState(false);
  const [hash, setHash] = useState(location.hash);

  useEffect(() => {
    const h = () => setHash(location.hash);
    addEventListener("hashchange", h);
    return () => removeEventListener("hashchange", h);
  }, []);

  if(hash === "#staff") return html`<${CmsDashboard}/>`;

  const openTab = (t) => { setTab(t); setStartOpen(false); setDropdownOpen(false); };

  return html`
    <div class="flex min-h-screen flex-col">
      <header class="glass sticky top-0 z-30 flex items-center justify-between px-6 py-3 border-b border-amber-600/30">
        <${BrandLogo}/>

        <nav class="hidden md:flex items-center gap-2 relative">
          <button class="btn-ghost ${tab==='feed'?'on':''}" onClick=${()=>setTab('feed')}>Home Editorial</button>
          <button class="btn-ghost ${tab==='social'?'on':''}" onClick=${()=>setTab('social')}>Social Page</button>
          <button class="btn-ghost ${tab==='mannequin'?'on':''}" onClick=${()=>setTab('mannequin')}>Manichino 3D</button>

          <div class="relative">
            <button class="btn-ghost flex items-center gap-1" onClick=${()=>setDropdownOpen(!dropdownOpen)}>
              Moduli ▾
            </button>
            ${dropdownOpen && html`
              <div class="absolute top-full left-1/2 -translate-x-1/2 mt-2 w-64 glass glass-strong p-2 space-y-1 shadow-2xl z-50">
                ${SYSTEM_MODULES.map(m => html`
                  <button class="w-full text-left p-2 rounded-xl text-xs hover:bg-amber-600/20 text-stone-200" onClick=${()=>openTab(m.id)}>
                    ${m.name}
                  </button>
                `)}
              </div>
            `}
          </div>
        </nav>

        <div class="flex items-center gap-2">
          <!-- BADGE ABBONAMENTO CLICCABILE -->
          <button class="btn-ghost text-xs uppercase tracking-wider text-amber-300 font-bold" onClick=${()=>setCheckoutTier(userTier==='free'?'pro':userTier)}>
            💎 ${userTier}
          </button>
          ${isStaff && html`<a href="#staff" class="btn-ghost text-xs">CMS Staff</a>`}
          <button class="btn-ghost" onClick=${()=>signOut(auth)}>Esci</button>
        </div>
      </header>

      <main class="mx-auto w-full max-w-[1200px] flex-1 px-4 pt-6 pb-32">
        ${tab==='feed' && html`<${FeedModule}/>`}
        ${tab==='social' && html`<${SocialPageModule}/>`}
        ${tab==='mannequin' && html`<${MannequinStudioModule}/>`}
        ${tab==='wardrobe' && html`<${WardrobeModule}/>`}
        ${tab==='orion' && html`<${OrionChatModule}/>`}
        ${tab==='profile' && html`<${ProfileModule}/>`}
      </main>

      <!-- START MENU WINDOWS STYLE MOBILE -->
      ${startOpen && html`
        <div class="fixed inset-0 z-40 bg-black/60 backdrop-blur-sm md:hidden" onClick=${()=>setStartOpen(false)}>
          <div class="fixed bottom-20 left-4 right-4 glass glass-strong p-5 space-y-4 border border-amber-600/40" onClick=${e=>e.stopPropagation()}>
            <div class="flex items-center justify-between border-b border-amber-600/20 pb-3">
              <${BrandLogo}/>
              <span class="text-[10px] text-amber-400 font-bold uppercase">Menu Start</span>
            </div>
            <div class="grid grid-cols-3 gap-3">
              ${SYSTEM_MODULES.map(m => html`
                <button class="glass p-3 flex flex-col items-center justify-center text-center space-y-1.5" onClick=${()=>openTab(m.id)}>
                  <${SvgIcon} name=${m.id} className="w-6 h-6 text-amber-400" />
                  <span class="text-[10px] font-bold text-white">${m.name}</span>
                </button>
              `)}
            </div>
          </div>
        </div>
      `}

      <!-- MOBILE DOCK -->
      <nav class="glass fixed inset-x-4 bottom-4 z-40 flex items-center justify-around p-2 md:hidden border border-amber-600/30 safe-bottom">
        <button class="flex flex-col items-center p-2 ${tab==='feed'?'text-amber-400':'text-stone-400'}" onClick=${()=>setTab('feed')}>
          <${SvgIcon} name="home" className="w-5 h-5"/><span class="text-[9px]">Home</span>
        </button>
        <button class="flex flex-col items-center p-2 ${tab==='social'?'text-amber-400':'text-stone-400'}" onClick=${()=>setTab('social')}>
          <${SvgIcon} name="social" className="w-5 h-5"/><span class="text-[9px]">Social</span>
        </button>

        <button class="relative -top-4 w-14 h-14 rounded-full bg-gradient-to-tr from-red-700 via-amber-600 to-amber-500 p-0.5 shadow-2xl flex items-center justify-center" onClick=${()=>setStartOpen(!startOpen)}>
          <div class="w-full h-full rounded-full bg-stone-950 flex items-center justify-center">
            <${SvgIcon} name="grid" className="w-6 h-6 text-amber-400" />
          </div>
        </button>

        <button class="flex flex-col items-center p-2 ${tab==='mannequin'?'text-amber-400':'text-stone-400'}" onClick=${()=>setTab('mannequin')}>
          <${SvgIcon} name="mannequin" className="w-5 h-5"/><span class="text-[9px]">3D Studio</span>
        </button>
        <button class="flex flex-col items-center p-2 ${tab==='profile'?'text-amber-400':'text-stone-400'}" onClick=${()=>setTab('profile')}>
          <${SvgIcon} name="profile" className="w-5 h-5"/><span class="text-[9px]">Profilo</span>
        </button>
      </nav>

      <${PayPalCheckoutModal}/>
    </div>
  `;
}

function Main(){
  const {profileData} = useApp();
  if(!profileData?.onboarded) return html`<${IntakeSurvey} onDone=${()=>window.location.reload()}/>`;
  return html`<${Shell}/>`;
}

function App(){
  return html`
    <${Providers}>
      <${AuthGate}>
        <${Main}/>
      <//>
    <//>
  `;
}

render(html`<${App}/>`, document.getElementById("app"));
</script>
</body>
</html>
